<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a sticky progress bar over one column of numbered cards, one Vids chunk per card */
:root{
  --paper:#f6f4ee; --sheet:#fffefa; --ink:#1e2230; --muted:#6a6c76; --rule:#d9d5c9;
  --pen:#2340a8; --brick:#a3412b; --tagbg:#e6e9f7; --pausebg:#f1e6df; --done:#2f7a4f; --donebg:#eaf3ec;
  --display:"Zilla Slab",Rockwell,Georgia,serif; --body:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);padding-inline:16px;padding-block:24px 80px;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:700 clamp(24px,4.4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:18px 0 0;text-wrap:balance;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h2 small{font:400 12px var(--mono);color:var(--muted)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.lede{margin:0;color:var(--muted);max-width:64ch;font-size:15.5px}
.rules{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12.5px/1.5 var(--mono);color:var(--muted)}
.rules b{color:var(--ink);font-weight:500}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:5px}
.prog .lbl{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--done);width:0;transition:width .25s}
button{font:500 12.5px/1 var(--mono);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;border-radius:3px;cursor:pointer}
button:hover{color:var(--pen);border-color:var(--pen)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
label.tg{font:400 12.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.card{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:0}
.card .num{font:500 13px var(--mono);color:var(--brick);padding:14px 12px;border-right:2px dashed var(--rule);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;align-items:center}
.card .body{padding:12px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.txt{margin:0;max-width:66ch}
.tag{font:500 12.5px var(--mono);background:var(--tagbg);color:var(--pen);padding:1px 5px;border-radius:2px;white-space:nowrap}
.tag.p{background:var(--pausebg);color:var(--brick)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.row .acts{display:flex;gap:12px;align-items:center}
.card.done{background:var(--donebg);border-color:var(--done)}
.card.done .txt{opacity:.6}
.card.done .num{color:var(--done)}
body.hidedone .card.done{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 13px var(--mono);padding:9px 14px;border-radius:3px}
textarea.fb{width:100%;height:110px;font:13px var(--mono);background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
@media (max-width:480px){.card{grid-template-columns:1fr}.card .num{flex-direction:row;border-right:0;border-bottom:2px dashed var(--rule);padding:8px 14px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <span class="eyebrow">Google Vids voiceover · Zeno</span>
    <h1>The ENTIRE History of Pompeii</h1>
    <p class="lede" id="lede"></p>
    <div class="rules"><span><b>Pace</b> natural only</span><span><b>Pauses</b> 0.3 s to 0.5 s, written as a number</span><span><b>No</b> whisper, slow, rushed, short, medium or long pause tags</span><span><b>Box</b> 3 sentences each</span></div>
  </header>
  <div class="sticky">
    <div class="prog"><span class="lbl" id="plbl"></span><div class="track"><div class="fill" id="pfill"></div></div></div>
    <button type="button" id="next">Jump to next</button>
    <label class="tg" for="hide"><input type="checkbox" id="hide"> Hide done</label>
    <button type="button" id="reset">Reset</button>
  </div>
  <main id="list" style="display:flex;flex-direction:column;gap:12px"></main>
</div>

<script>
const D = {"secs": [{"t": "Cold open · The city the world forgot", "c": [{"text": "[natural pace] [bold] This is Pompeii. [0.3s] You probably think it's just an old Roman city that a volcano wiped out in a single day. [0.4s] But the story of Pompeii begins seven hundred years before that day, and it still hasn't ended.", "words": 38}, {"text": "[sarcasm] Spartacus once hid with his rebel army on the mountain behind it, and nobody had any idea it was a volcano. [0.3s] Seventeen years before the end, an earthquake shook the city like a warning, and people simply started repairing it. [0.4s] And when the mountain finally exploded, a Roman admiral sailed straight toward it to rescue people.", "words": 56}, {"text": "[serious] Then the city vanished so completely that for about fifteen hundred years, people forgot even its name. [0.3s] An engineer dug a canal right underneath it, and never realized a whole city was sleeping beneath his feet. [0.5s] And today, hundreds of thousands of people live in the shadow of that same mountain, while more than four million visitors come to see the city every year.", "words": 64}, {"text": "[interest] It wasn't lava that killed Pompeii, and it wasn't just the ash. [0.3s] It was a storm of scorching gas and ash, and a mountain that nobody believed was a volcano. [0.4s] Now, let's take a closer look at the story of the Roman city that became immortal by dying.", "words": 48}]}, {"t": "The city under the mountain", "c": [{"text": "[natural pace] [natural] Look at a map of southern Italy, the blue water of the Bay of Naples, and behind it, one lonely green mountain, Vesuvius. [0.3s] Pompeii sat about ten kilometres from that mountain, near the mouth of the Sarno River, where boats carried goods deep inland. [0.4s] It was perfectly placed between the sea, the river and the farmland.", "words": 56}, {"text": "[awe] And the soil here was almost magical. [0.3s] Ash from ancient eruptions had made the land so fertile that vineyards, olive groves and orchards covered the slopes of Vesuvius. [0.5s] Think about that for a second, the very thing that made this region rich was one day going to destroy it.", "words": 49}, {"text": "[curiosity] The Romans thought Vesuvius was just an ordinary mountain. [0.3s] In 73 BC, the rebel gladiator Spartacus hid on its summit with his followers, and according to a famous story, they escaped by climbing down on ropes made of wild grapevines. [0.4s] Back then, the summit was covered in grass and vines, and nobody imagined it was a sleeping volcano.", "words": 58}]}, {"t": "From Oscan town to Roman city (6th century BC)", "c": [{"text": "[natural pace] [interest] Pompeii wasn't founded by Rome. [0.3s] It was built in the seventh or sixth century BC by the Oscans, an ancient people who lived in this region. [0.4s] Greek traders and the Etruscans left their mark here too, and later the Samnites came down from the mountains and took control.", "words": 48}, {"text": "[serious] For a long time, Pompeii was an ally of Rome, but its people were not Roman citizens. [0.3s] In 89 BC, many Italian cities rose up against Rome to demand equal rights, and Pompeii joined them. [0.4s] The Roman general Sulla laid siege to the city, and you can still see the scars of that siege on Pompeii's walls today.", "words": 58}, {"text": "[surprised] And then, the twist. [0.3s] Even after the revolt failed, Pompeii was given Roman citizenship, and in 80 BC Sulla settled thousands of his veteran soldiers there. [0.4s] The city was renamed in honour of Venus, the goddess of love, and soon Latin replaced the old Oscan language on its streets.", "words": 49}]}, {"t": "Roman Pompeii's golden age (1st century AD)", "c": [{"text": "[natural pace] [admiration] Over the next hundred and fifty years, Pompeii became a dazzling Roman city. [0.3s] An estimated eleven thousand people lived here, and at its heart was a great forum, surrounded by temples, a law court and markets. [0.4s] It had public baths, two theatres, and a stone arena that is now considered the oldest surviving Roman amphitheatre.", "words": 55}, {"text": "[amused] And the people of Pompeii loved their food. [0.3s] The streets were lined with dozens of shops where hot food and wine were served from jars set into stone counters, just like street food today. [0.4s] They also made garum, a pungent sauce of fermented fish that Romans poured on almost everything.", "words": 50}, {"text": "[amused] The best part is the walls. [0.3s] Thousands of pieces of writing have been found on Pompeii's walls, election slogans, love notes, shop adverts, and plenty of insults too. [0.4s] In a way, it was social media from two thousand years ago, except people wrote on walls instead of phones.", "words": 48}, {"text": "[interest] The houses of the rich were like palaces. [0.3s] Inside were colourful wall paintings and courtyards with fountains, and one doorway has a mosaic of a dog with words in Latin that mean, beware of the dog. [0.4s] Outside the city, one villa has paintings so mysterious that it's known today as the Villa of the Mysteries.", "words": 55}]}, {"t": "The amphitheatre riot (59 AD)", "c": [{"text": "[natural pace] [sarcasm] But Pompeii's most famous scandal happened twenty years before the volcano. [0.3s] In 59 AD, crowds from Pompeii and the neighbouring town of Nuceria came to watch a gladiator show, and the taunts turned into stones, and then into swords. [0.4s] According to the Roman historian Tacitus, many people from Nuceria were killed or wounded.", "words": 53}, {"text": "[authoritative] The case went all the way to the Senate in Rome. [0.3s] The Senate banned Pompeii from holding such games for ten years, and the man who organized the show was sent into exile. [0.4s] Someone even painted the riot on a wall, and that painting still survives, one of the oldest pictures of sports violence ever found.", "words": 56}]}, {"t": "The first warning (62 AD)", "c": [{"text": "[natural pace] [cautious] Then, in 62 AD, the ground shook. [0.3s] A powerful earthquake smashed Pompeii's temples, houses and water pipes, and the philosopher Seneca wrote that an entire flock of sheep nearby dropped dead. [0.4s] Today, many scientists believe it may have been the first sign of Vesuvius waking up.", "words": 46}, {"text": "[frustrated] But the people of Pompeii didn't leave, they started rebuilding. [0.3s] Seventeen years later, many buildings were still under repair, and excavators have found workers' tools and half-painted rooms. [0.5s] Seventeen years, remember that number, because it comes back at the end of this story.", "words": 43}, {"text": "[cautious] In 79 AD, the ground trembled gently for several days. [0.3s] An eyewitness later wrote that nobody was very worried, because earthquakes were common in the region. [0.4s] Nobody knew that deep inside the mountain, a huge mass of molten rock was looking for a way out.", "words": 45}]}, {"t": "The day (79 AD)", "c": [{"text": "[natural pace] [serious] For centuries, people believed the eruption happened on the twenty-fourth of August. [0.3s] But in 2018, excavators found a date scribbled in charcoal on a wall, pointing to the middle of October. [0.4s] So today, many experts think the eruption most likely happened in October of 79 AD.", "words": 46}, {"text": "[surprised] Around one in the afternoon, the top of Vesuvius exploded. [0.3s] A giant column of rock, ash and gas, by some estimates more than thirty kilometres high, shot into the sky. [0.4s] Across the bay, a seventeen-year-old named Pliny the Younger later wrote that the cloud looked like a giant pine tree.", "words": 50}, {"text": "[cautious] Then stones began to fall from the sky. [0.3s] Light, frothy volcanic rock called pumice rained down on Pompeii for hours, and darkness fell in the middle of the day. [0.4s] Roofs started collapsing under the weight, and thousands of people grabbed whatever they could carry and fled.", "words": 46}, {"text": "[admiration] At that moment, across the bay, the admiral of the Roman fleet, Pliny the Elder, set out with his ships to rescue people. [0.3s] He was one of Rome's greatest scholars, the man who had written an entire encyclopedia of the natural world. [0.4s] According to his nephew, when his sailors grew afraid, he told them that fortune favours the brave.", "words": 59}, {"text": "[thoughtful] But this time, fortune did not favour the brave. [0.3s] Pliny reached the shore, but fierce winds and high waves stopped his ships from sailing back. [0.4s] The next day, surrounded by ash and poisonous air, he died on the beach.", "words": 39}, {"text": "[serious] During the night, the deadliest part of the eruption began. [0.3s] The ash column collapsed under its own weight, and a storm of gas and ash, hundreds of degrees hot, raced down the mountain at more than a hundred kilometres an hour. [0.4s] It's called a pyroclastic flow, and outrunning one is almost impossible.", "words": 52}, {"text": "[serious] The first target was the nearby seaside town of Herculaneum. [0.3s] Its people had taken shelter in the boat sheds along the beach, and archaeologists later found around three hundred skeletons there, huddled together. [0.4s] They were waiting for ships that never came.", "words": 41}, {"text": "[cautious] The next morning, the storm reached Pompeii. [0.3s] Anyone still in the city, or still on the road trying to escape, had only moments. [0.5s] Within minutes, a living city seven hundred years old was buried under four to six metres of ash and stone.", "words": 43}]}, {"t": "The forgotten city (after 79 AD)", "c": [{"text": "[natural pace] [thoughtful] The remains of more than a thousand people have been found at Pompeii so far, but nobody knows for sure how many died in total. [0.3s] Most people probably escaped in time. [0.4s] And research shows that many survivors resettled in nearby cities like Naples, Cumae, Puteoli and Ostia.", "words": 47}, {"text": "[curiosity] So here's the question, why wasn't Pompeii ever rebuilt? [0.3s] Emperor Titus sent officials and money to help the region, but the city lay under metres of ash, and its harbour, farms and roads had all vanished. [0.4s] Some people did return to live in the ruins, and some dug tunnels to recover their valuables, but Pompeii never became a city again.", "words": 60}, {"text": "[surprised] Centuries passed, and grass, fields and vineyards grew over the ash. [0.3s] Local people simply called the land La Civita, meaning the city, but nobody remembered which city it had been. [0.5s] For about fifteen hundred years, the name Pompeii disappeared from memory.", "words": 41}]}, {"t": "Rediscovery (1590s onward)", "c": [{"text": "[natural pace] [sarcasm] In the 1590s, an engineer named Domenico Fontana was digging a canal to carry water from the Sarno River. [0.3s] His canal ran straight under Pompeii, and his workers even hit walls and inscriptions along the way. [0.4s] But nobody understood what they had found, and he simply finished his canal and moved on.", "words": 52}, {"text": "[interest] The real digging began about a hundred and fifty years later. [0.3s] In 1748, workers started excavating here for the Bourbon king of Naples, but they weren't looking for history, they were looking for treasure. [0.4s] Statues and artworks were carted off to the royal palace, and sometimes wall paintings were simply cut out and taken away.", "words": 55}, {"text": "[surprised] For fifteen years, they didn't even know which city they were digging up. [0.3s] Then, in 1763, they finally found a stone inscription naming the people of Pompeii. [0.4s] After fifteen hundred years, the lost city was called by its name again.", "words": 40}, {"text": "[awe] Then, in 1863, the archaeologist Giuseppe Fiorelli noticed something strange. [0.3s] Inside the hardened ash were hollow spaces where human bodies had once been, the bodies had decayed, but their shapes were pressed into the ash. [0.5s] Fiorelli poured plaster into those hollows, and when the ash was chipped away, there they were, frozen in the exact moment of their last breath.", "words": 60}]}, {"t": "Modern Pompeii (1943 to today)", "c": [{"text": "[natural pace] [frustrated] Pompeii survived a volcano, but surviving the modern world was harder. [0.3s] In 1943, during the Second World War, Allied planes dropped more than a hundred bombs on the site, destroying the museum and many houses. [0.4s] And the very next year, Vesuvius erupted again, wrecking dozens of American bombers parked at a nearby airfield.", "words": 53}, {"text": "[cautious] In 1997, Pompeii became a UNESCO World Heritage Site, but neglect continued. [0.3s] In 2010, an old house used by gladiators suddenly collapsed, causing outrage around the world. [0.4s] After that, a huge rescue project worth around a hundred and five million euros began, with help from the European Union.", "words": 48}, {"text": "[hope] And after that, Pompeii started talking again. [0.3s] Excavators uncovered an entire street food shop with its colourful paintings, and a wall painting of a flatbread topped with fruit and spices that people started calling the ancestor of pizza. [0.4s] In 2025, they even found evidence that some people came back after the eruption and lived among the ruins.", "words": 57}, {"text": "[surprised] The most shocking discovery came from DNA. [0.3s] In 2024, scientists tested the DNA of people inside the plaster casts, and found that a pair long believed to be a mother and child were actually an adult man and a child who weren't related at all. [0.4s] So many of the stories we told about Pompeii's victims may have been ones we invented ourselves.", "words": 62}, {"text": "[awe] And in nearby Herculaneum, another miracle is happening. [0.3s] Hundreds of ancient scrolls were found in a villa there, burned into charcoal, so fragile they crumbled when anyone tried to open them. [0.4s] Now, with artificial intelligence and scanning, the words on those burnt pages are being read for the first time in two thousand years.", "words": 54}]}, {"t": "Today's danger", "c": [{"text": "[natural pace] [serious] Today, Pompeii is one of the most visited places in Italy, with more than four million visitors in a single year. [0.3s] The crowds grew so big that there's now a limit of twenty thousand visitors a day. [0.4s] And the surprising part is that about a third of the city is still buried under the ash.", "words": 55}, {"text": "[cautious] But the real story isn't Pompeii, it's the mountain. [0.3s] Vesuvius is still an active volcano, and around six to seven hundred thousand people live in its most dangerous area, known as the red zone. [0.4s] Italy has an evacuation plan, but experts warn that moving that many people out in time won't be easy.", "words": 53}, {"text": "[thoughtful] Remember those seventeen years between the earthquake of 62 and the eruption of 79? [0.3s] Vesuvius last erupted in 1944, which means it has now been quiet for eighty-two years. [0.5s] And when it comes to volcanoes, a long silence isn't always good news.", "words": 42}]}, {"t": "The story of Pompeii", "c": [{"text": "[natural pace] [thoughtful] So that's the story of Pompeii. [0.3s] A small Oscan harbour town that became Roman after a revolt, a living city of street food and messages on the walls, that ignored a warning and was buried in a single day. [0.4s] And when it woke up fifteen hundred years later, its death had made it immortal.", "words": 54}, {"text": "[curiosity] Pompeii shows us that people two thousand years ago were just like us, they ate, they fought, they fell in love, and they believed tomorrow would be just like today. [0.3s] And today, under the same mountain, hundreds of thousands of people are living with that same belief. [0.5s] So what do you think, if Vesuvius wakes up again, will we be ready this time?", "words": 63}, {"text": "[positive] Tell me in the comments, and if you want the full story of the Colosseum next, let me know there too. [0.3s] If you love long, true stories from history, this channel is for you. [0.4s] Subscribe for the next long story.", "words": 40}]}], "words": 2287};
const KEY="vo-done-the-entire-history-of-pompeii";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
