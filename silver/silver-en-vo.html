<style>
/* Layout: a sticky progress bar over one column of numbered cards, one Vids chunk per card */
:root{

}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);padding-inline:16px;padding-block:24px 80px;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:700 clamp(24px,4.4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}

.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.lede{margin:0;color:var(--muted);max-width:64ch;font-size:15.5px}
.rules{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12.5px/1.5 var(--mono);color:var(--muted)}

.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center}

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">

    <p class="lede" id="lede"></p>
    <div class="rules"><span><b>Pace</b> natural only</span><span><b>Pauses</b> 0.3 s to 0.5 s, written as a number</span><span><b>No</b> whisper, slow, rushed, short, medium or long pause tags</span><span><b>Box</b> 3 sentences each</span></div>

<script>
const D = {"secs": [{"t": "Cold open · The metal that paid the world", "c": [{"text": "[natural pace] [bold] This is silver. [0.3s] You probably think it's gold's cheaper little sibling, the metal for spoons, anklets and second place medals. [0.4s] But for most of human history, silver, not gold, was the money that ordinary people actually used.", "words": 37}, {"text": "[sarcasm] A lucky strike of silver built the warships that saved ancient Athens. [0.3s] A mountain of it in South America built a city as big as London, and killed thousands of the people who mined it. [0.4s] And two Texas brothers tried to buy up a huge share of the world's silver, and watched it all collapse in a single day.", "words": 59}, {"text": "[serious] Silver conducts electricity better than any other metal on Earth, and it reflects light better than any other metal too. [0.3s] That's why it's inside your phone, your car and almost every solar panel. [0.5s] And remember this, because unlike gold, a huge share of the silver we dig up is used once, and then it's gone for good.", "words": 57}, {"text": "[interest] It wasn't silver's beauty that made it so powerful, and it wasn't its rarity. [0.3s] It was usefulness, first as money in every market, and now as a metal the modern world can't run without. [0.4s] Now, let's take a closer look at the four and a half billion year story of the metal that paid the world.", "words": 56}]}, {"t": "Forged in exploding stars", "c": [{"text": "[natural pace] [awe] Silver is older than the Earth itself. [0.3s] Scientists believe it was forged inside dying stars and in some of the most violent explosions in the universe, from giant stars blowing apart to dead neutron stars smashing together. [0.4s] Some astronomers even think silver and gold were mostly made in different kinds of cosmic events.", "words": 53}, {"text": "[thoughtful] About four and a half billion years ago, those atoms became part of the new Earth. [0.3s] Today, silver is nearly twenty times more common than gold in the Earth's crust, but it's still rare, about one gram in thirteen tonnes of rock. [0.4s] And unlike gold, silver rarely sits around in pure nuggets, which is why humans found it so much later.", "words": 61}]}, {"t": "Hidden inside lead (3500 BC)", "c": [{"text": "[natural pace] [curiosity] Most of the world's silver is hidden inside other ores, especially lead. [0.3s] More than five thousand years ago, in what's now Turkey, Syria and Iran, metalworkers figured out how to get it out. [0.4s] They melted the ore and blew air over it, until the lead burned away and a tiny bead of shining silver was left behind.", "words": 57}, {"text": "[interest] The process is called cupellation, and archaeologists have found its waste, a lead residue called litharge, at sites more than five thousand years old. [0.3s] It was dirty, toxic and slow work. [0.4s] But it meant that, for the first time, people could make silver wherever they could find the right rock.", "words": 50}]}, {"t": "The first money (1750 BC)", "c": [{"text": "[natural pace] [serious] In ancient Mesopotamia, the land between the Tigris and Euphrates rivers, silver became something new, money. [0.3s] There were no coins yet, so people weighed out pieces of silver, using a unit called the shekel. [0.4s] Rings, coils and scraps of silver were cut and weighed to pay for grain, land and debts.", "words": 51}, {"text": "[authoritative] Around 1750 before Christ, King Hammurabi of Babylon carved nearly three hundred laws into stone, many with prices in silver. [0.3s] According to one law, a hired labourer earned about one shekel of silver a month. [0.4s] A doctor who performed a successful operation could charge ten shekels, so silver was already setting prices almost four thousand years ago.", "words": 57}]}, {"t": "The silver pharaoh (1000 BC)", "c": [{"text": "[natural pace] [surprised] In Egypt, gold came fairly easily from the mines of Nubia, but silver had to be brought in from far away. [0.3s] So for long stretches of Egyptian history, silver was reportedly valued even more highly than gold. [0.4s] Egyptians said the gods had flesh of gold, and bones of silver.", "words": 49}, {"text": "[awe] In 1940, a French archaeologist named Pierre Montet opened the burial chamber of a pharaoh called Psusennes the First, at Tanis. [0.3s] Inside, the king lay in a coffin made of silver, with a gold mask on his face. [0.5s] But the world was at war, and one of the greatest royal burials ever found barely made the news.", "words": 57}]}, {"t": "The silver that saved Athens (483 BC)", "c": [{"text": "[natural pace] [interest] South of Athens, in a hilly area called Laurion, the Greeks had been mining silver for centuries. [0.3s] Then, around 483 before Christ, miners hit an enormously rich new vein. [0.4s] Most Athenians wanted to do the obvious thing, and share the money out among the citizens.", "words": 45}, {"text": "[determination] But a politician named Themistocles had another idea. [0.3s] He persuaded the city to spend the silver on warships, building a fleet that grew to around two hundred fast triremes. [0.4s] Officially, they were for a war with a nearby island, but Themistocles was worried about a much bigger enemy, Persia.", "words": 49}, {"text": "[surprised] In 480 before Christ, the huge Persian fleet was lured into the narrow straits of Salamis, and the Greek ships crushed it. [0.3s] Athens went on to its golden age, stamping its famous owl coins from the same mines. [0.5s] But those mines were worked by enslaved people, by some estimates tens of thousands of them, deep underground.", "words": 56}]}, {"t": "Rome's silver habit (200 BC to 270 AD)", "c": [{"text": "[natural pace] [serious] Rome took the silver mines of Spain from Carthage, and worked them on a massive scale. [0.3s] The Greek historian Polybius wrote that the mines near New Carthage alone employed forty thousand workers. [0.4s] All that silver became the denarius, the coin that paid Rome's soldiers.", "words": 44}, {"text": "[awe] Roman smelting was so huge that its pollution travelled all the way to Greenland. [0.3s] In 2018, scientists studying Greenland's ice found layers of lead pollution that rose and fell with the Roman economy. [0.4s] Two thousand years later, the ice still remembers how much silver Rome made.", "words": 46}, {"text": "[frustrated] But then the emperors found a shortcut. [0.3s] Starting around the time of Nero, they mixed more and more cheap metal into the coins, and by the late third century, a so-called silver coin was little more than copper with a thin silver coating. [0.5s] Prices soared, and people stopped trusting the money of the most powerful empire on Earth.", "words": 58}]}, {"t": "The valley that named the dollar (1516)", "c": [{"text": "[natural pace] [curiosity] Fast forward to 1516, in a valley called Joachimsthal, in what's now the Czech Republic. [0.3s] Miners found rich silver there, and a local count began minting big silver coins called Joachimsthalers. [0.4s] The name was a mouthful, so people shortened it to thaler.", "words": 42}, {"text": "[surprised] The Dutch said daler, and English speakers said dollar. [0.3s] American colonists used that word for the Spanish silver coins they handled every day, and after independence, the United States made it the name of its own money. [0.5s] So the most powerful currency on Earth is named after a silver mining valley in Europe.", "words": 53}, {"text": "[interest] Around the same time, in India, the ruler Sher Shah Suri issued a silver coin called the rupiya, in the 1540s. [0.3s] Its name comes from an old Sanskrit word connected with silver. [0.4s] Today, more than one and a half billion people still use money called the rupee.", "words": 47}]}, {"t": "The mountain that eats men (1545)", "c": [{"text": "[natural pace] [curiosity] In 1545, high in the Andes, in what's now Bolivia, a local man named Diego Huallpa made a discovery. [0.3s] According to a famous story, he lit a fire on a mountainside, and melted silver began to trickle out of the ground. [0.4s] Historians doubt the legend, but the silver was real, and the mountain became known as Cerro Rico, the rich hill.", "words": 61}, {"text": "[awe] The city of Potosí grew at its foot, more than four thousand metres above sea level. [0.3s] By around 1610, it was reported to have about one hundred and sixty thousand people, roughly as big as London or Paris at the time. [0.4s] In Spanish, something precious became worth a Potosí, a phrase even Don Quixote uses.", "words": 55}, {"text": "[cautious] But that wealth came at a terrible cost. [0.3s] From the 1570s, Spain forced indigenous villages to send their men to the mines, under a labour system called the mita. [0.4s] Miners faced collapses, freezing cold and toxic mercury used to refine the ore, and Cerro Rico became known as the mountain that eats men.", "words": 53}, {"text": "[serious] Historians still argue about how many died, but over more than two centuries it was many thousands. [0.3s] Potosí's silver was stamped into a Spanish coin called the piece of eight, which travelled to every corner of the world. [0.4s] It became the first truly global currency, and it was legal money in the United States until 1857.", "words": 56}, {"text": "[amused] Here's a strange twist. [0.3s] Early explorers heard rumours of a mountain of silver deep inland, so they named a great river the River of Silver, and the land around it became Argentina, from argentum, the Latin word for silver. [0.4s] But Argentina itself had little silver, and the mountain they dreamed of was most likely Potosí.", "words": 55}]}, {"t": "Silver for China (1570 to 1815)", "c": [{"text": "[natural pace] [interest] Here's the part most history books leave out, much of that American silver didn't stay in Europe. [0.3s] In the 1580s, Ming China began requiring many taxes to be paid in silver, and a country of well over a hundred million people suddenly needed enormous amounts of it. [0.4s] China had silk, porcelain and tea, but not enough silver.", "words": 57}, {"text": "[awe] So from the 1570s, Spanish galleons sailed from Mexico across the Pacific to Manila, in the Philippines, loaded with silver. [0.3s] There, it was traded for Chinese goods, and the route ran for about two and a half centuries. [0.4s] Some historians estimate that a third or more of all the silver mined in the Americas ended up in China.", "words": 58}]}, {"t": "The silver rush (1859)", "c": [{"text": "[natural pace] [excited] In 1859, miners in the hills of Nevada kept cursing a heavy blue mud that clogged their gold equipment. [0.3s] Then someone tested it, and it turned out to be incredibly rich silver ore. [0.4s] It was the Comstock Lode, the first major silver discovery in the United States.", "words": 47}, {"text": "[amused] It was named after Henry Comstock, who reportedly sold his share for about eleven thousand dollars, and died broke. [0.3s] Nevada's silver is often said to have helped the Union in the Civil War, and Nevada became a state in 1864. [0.4s] And in the boomtown of Virginia City, a young reporter started signing his articles with a new name, Mark Twain.", "words": 60}]}, {"t": "Gold against silver (1873 to 1900)", "c": [{"text": "[natural pace] [serious] For centuries, many countries used both gold and silver as money, at a fixed ratio. [0.3s] But as Britain and then Germany moved to gold, the United States passed a law in 1873 that quietly stopped the free coining of silver dollars. [0.4s] Silver miners and farmers were furious, and they called it the Crime of 1873.", "words": 55}, {"text": "[determination] By the 1890s, gold against silver had become the biggest fight in American politics. [0.3s] In 1896, a young politician named William Jennings Bryan gave a famous speech, warning that mankind must not be crucified on a cross of gold. [0.4s] He won the nomination for president, but he lost the election, and silver lost the war.", "words": 55}]}, {"t": "Pictures made of silver (1839 to 2012)", "c": [{"text": "[natural pace] [interest] In 1839, Louis Daguerre unveiled one of the first practical forms of photography, made on silver-coated copper plates. [0.3s] For the next century and a half, almost every photograph and film relied on silver compounds that darken when light hits them. [0.4s] Every family photo, every Hollywood movie and every hospital X-ray was, in a way, made of silver.", "words": 57}, {"text": "[surprised] By the late 1990s, photography was using roughly a third of all the silver bought in the world, by some estimates. [0.3s] Kodak, the giant of film, became one of the biggest silver users on Earth, and it even recovered silver from its own waste. [0.5s] Then digital cameras arrived, and in 2012, Kodak filed for bankruptcy.", "words": 55}]}, {"t": "The silver brothers (1965 to 1980)", "c": [{"text": "[natural pace] [cautious] Meanwhile, silver was disappearing from people's pockets. [0.3s] As its price rose, the metal in coins became worth more than the coins themselves, so Britain dropped silver from its coins in 1947, and America from its dimes and quarters in 1965. [0.4s] In much of the world, everyday money stopped being silver.", "words": 50}, {"text": "[interest] Then came two brothers from a rich Texas oil family, Nelson Bunker Hunt and William Herbert Hunt. [0.3s] In the 1970s, worried about inflation, they started buying silver, and then they kept buying, much of it with borrowed money. [0.4s] By some estimates, they and their partners controlled well over a hundred million ounces.", "words": 52}, {"text": "[excited] In early 1979, silver cost about six dollars an ounce. [0.3s] By January 1980, it had hit roughly fifty dollars. [0.5s] Remember that number, fifty dollars an ounce, because it comes back later.", "words": 31}, {"text": "[frustrated] Then the exchanges changed the rules, limiting new buying with borrowed money, and interest rates jumped. [0.3s] On March twenty-seventh, 1980, now known as Silver Thursday, the Hunts couldn't meet a margin call, and silver fell to about ten dollars and eighty cents. [0.4s] The brothers lost an estimated one point seven billion dollars, and years later they declared bankruptcy.", "words": 58}]}, {"t": "Silver today (2025 to 2026)", "c": [{"text": "[natural pace] [serious] Today, silver isn't mostly money anymore, it's a working metal. [0.3s] It's in phones, cars, wound dressings and data centres, and solar panels alone used nearly one hundred and ninety million ounces of it in 2025. [0.4s] For five years in a row, the world has used more silver than mines and recycling could supply.", "words": 53}, {"text": "[surprised] And remember that fifty dollars. [0.3s] For forty-five years it was the ceiling, until October 2025, when silver finally broke through it. [0.4s] Then it went wild, and in late January 2026, it hit a record of about one hundred and twenty-one dollars an ounce.", "words": 43}, {"text": "[cautious] The very next day, silver crashed by more than a quarter, one of its biggest one-day falls in history. [0.3s] By this October, it was trading near sixty dollars, around half its peak. [0.4s] And those high prices pushed solar factories to use less silver per panel, and to swap some of it for copper.", "words": 53}, {"text": "[thoughtful] And remember what we said at the start. [0.3s] By one industry estimate, around half of all the silver ever mined has already been used up or lost, scattered in tiny amounts across old electronics, landfills and rubbish dumps. [0.4s] Gold gets locked in vaults and kept forever, but silver gets used.", "words": 50}]}, {"t": "Ending", "c": [{"text": "[thoughtful] So that's silver. [0.3s] A metal forged in exploding stars, weighed out in Babylon, turned into warships at Athens, dug from a mountain that ate men, shipped to China, and bet away by two Texas brothers. [0.4s] For most of history it was the money of ordinary people, and today it's the metal that quietly powers the modern world.", "words": 57}, {"text": "[natural pace] [curiosity] This is history, not financial advice, and nobody knows where the price goes next. [0.4s] So what do you think will happen to silver in the next fifty years? [0.3s] Tell me in the comments, and subscribe for the next long story.", "words": 40}]}], "words": 2295};
const KEY="vo-done-4-5-billion-year-history-of-silver-in-15-minutes";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
