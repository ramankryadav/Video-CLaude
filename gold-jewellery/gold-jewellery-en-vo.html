<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <span class="eyebrow">Google Vids voiceover · Zeno</span>
    <h1>Why Humans Became Obsessed With Gold Jewellery</h1>
    <p class="lede" id="lede"></p>
    <div class="rules"><span><b>Pace</b> natural only</span><span><b>Pauses</b> 0.3 s to 0.5 s, written as a number</span><span><b>No</b> whisper, slow, rushed, short, medium or long pause tags</span><span><b>Box</b> 3 sentences each</span></div>

<script>
const D = {"secs": [{"t": "Cold open · The metal we wear", "c": [{"text": "[natural pace] [bold] This is a gold ring. [0.3s] You probably think it's just a piece of jewellery, something you get at a wedding and then forget about in a drawer. [0.4s] But humans have been obsessed with wearing gold for more than six thousand years, and that obsession has buried queens, sparked street protests, and sent treasure hunters across the world.", "words": 57}, {"text": "[sarcasm] A queen in ancient Iraq was buried with dozens of people, all dressed in their finest gold. [0.3s] A German businessman dug up a treasure, draped it on his wife for a photo, and then the whole thing vanished for fifty years. [0.4s] And the women of ancient Rome filled the streets until the government gave them back their gold.", "words": 58}, {"text": "[serious] Even today, when gold prices hit record after record, people still line up outside jewellery shops. [0.3s] In 2025, the world bought the least gold jewellery by weight in five years, and yet spent more money on it than ever before. [0.5s] Hold on to that, because by the end of this video, you'll understand why we just can't stop.", "words": 58}, {"text": "[interest] It wasn't the shine that made gold the jewellery of humanity, and it wasn't the price. [0.3s] It was a message, telling everyone who you are, who you belong to, and what you'd still have if everything else was lost. [0.4s] Now, let's take a closer look at why humans became obsessed with gold jewellery, and why the most famous piece of all is worn on one very particular finger.", "words": 68}]}, {"t": "Before gold", "c": [{"text": "[natural pace] [curiosity] Long before anyone touched gold, humans were already decorating themselves. [0.3s] In a cave in Morocco, archaeologists found tiny sea snail shells with holes drilled through them, worn as beads at least a hundred and forty thousand years ago. [0.4s] Some of them may even have been coloured with red ochre, like a painted necklace.", "words": 53}, {"text": "[thoughtful] Even Neanderthals seem to have joined in, and eagle talons they may have worn as jewellery were found in Croatia, more than a hundred thousand years old. [0.3s] Jewellery is older than farming, older than writing, and older than cities. [0.5s] Before we ever learned to grow food, we had already learned to show off.", "words": 53}]}, {"t": "Why gold won", "c": [{"text": "[natural pace] [interest] Then, at some point, someone picked a shiny yellow pebble out of a river. [0.3s] Gold is one of the very few metals found in nature in its pure form, so you don't need a furnace to get it. [0.4s] It's so soft you can shape it with a stone, and so stretchy that a single gram can be drawn into a wire more than two kilometres long.", "words": 66}, {"text": "[awe] But gold's real superpower is that it never rusts, never tarnishes, and never fades. [0.3s] Copper turns green, silver turns black, and iron crumbles into dust. [0.5s] Gold pulled from a six thousand year old grave shines exactly like the day it went in.", "words": 42}]}, {"t": "The first gold jewellery (4500 BC)", "c": [{"text": "[natural pace] [surprised] And that grave really exists. [0.3s] In 1972, near the city of Varna in Bulgaria, a worker digging a trench found a cemetery full of gold bracelets, beads and ornaments, around six thousand years old. [0.4s] It's the oldest large collection of worked gold ever found, older than the pyramids of Egypt.", "words": 50}, {"text": "[thoughtful] But here's the strange part. [0.3s] Most graves in that cemetery held almost nothing, while a few held huge amounts of gold, and many archaeologists see it as one of the earliest clear signs of rich and poor in human history. [0.5s] The very first gold jewellery wasn't about beauty, it was about rank.", "words": 52}]}, {"t": "The queen of Ur (2600 BC)", "c": [{"text": "[natural pace] [curiosity] Now jump forward almost two thousand years, to the city of Ur in southern Iraq. [0.3s] In the 1920s, a British archaeologist named Leonard Woolley started digging into a field of ancient graves there. [0.4s] What he found became known as the Royal Tombs of Ur.", "words": 44}, {"text": "[awe] In one tomb lay a woman known today as Queen Puabi, whose name was carved on a small stone seal beside her. [0.3s] She wore a headdress of gold leaves, gold ribbons and a tall golden comb, with strings of blue lapis lazuli and red carnelian draped across her body. [0.4s] That lapis came from the mountains of Afghanistan, more than two thousand kilometres away.", "words": 63}, {"text": "[serious] And she didn't go alone. [0.3s] Around two dozen attendants were found in and around her tomb, and in another royal grave nearby, Woolley counted seventy-four people, most of them women wearing gold ribbons in their hair. [0.4s] Historians still argue about how these people died, and whether they chose to follow their ruler into the afterlife.", "words": 55}, {"text": "[amused] Woolley described one tiny detail that made it all feel very human. [0.3s] One woman's silver hair ribbon was found still rolled up in a coil near her waist, as if she'd been running late and never had time to put it on. [0.5s] Four and a half thousand years ago, someone still couldn't get ready on time.", "words": 56}]}, {"t": "The Indian connection", "c": [{"text": "[natural pace] [interest] Some of the red carnelian beads found at Ur didn't come from Iraq at all. [0.3s] They were etched with white patterns in a style made in the Indus Valley, in what is now Pakistan and northwest India. [0.4s] So four and a half thousand years ago, jewellery was already one of the world's first international trade goods.", "words": 56}]}, {"t": "Gold of the pharaohs", "c": [{"text": "[natural pace] [awe] Then came Egypt, where gold wasn't just jewellery, it was religion. [0.3s] Egyptians believed the skin of their gods was made of gold, because gold never decayed, just like the gods never died. [0.4s] So a pharaoh covered in gold wasn't just showing he was rich, he was showing he was halfway to divine.", "words": 52}, {"text": "[surprised] Gold jewellery even became some of the world's first military medals. [0.3s] About three and a half thousand years ago, Queen Ahhotep was buried with three golden flies on a chain, which many historians think was a reward for courage in war. [0.4s] The fly was supposedly chosen because it keeps coming back, no matter how many times you swat it.", "words": 59}, {"text": "[interest] And then there's Tutankhamun. [0.3s] When Howard Carter first peered into his tomb in 1922, his sponsor asked if he could see anything, and he reportedly answered, yes, wonderful things. [0.4s] Inside was the famous golden mask, about ten kilograms of solid gold, along with more than a hundred pieces of jewellery, many wrapped right into the mummy's bandages.", "words": 57}, {"text": "[thoughtful] But here's the twist. [0.3s] Tutankhamun was a fairly minor king, and his tomb survived mostly because it was small and hidden under rubble. [0.5s] Almost every other royal tomb had been emptied by robbers long before, because the gold meant to protect them forever was exactly what got them robbed.", "words": 49}]}, {"t": "The treasure of Troy (1873)", "c": [{"text": "[natural pace] [curiosity] Enter Heinrich Schliemann, a German businessman who made a fortune and then decided to find the lost city of Troy from Homer's legends. [0.3s] Many scholars thought Troy was a myth, but Schliemann started digging at a hill in Turkey called Hisarlik. [0.4s] In 1873, he announced he'd found the treasure of King Priam, the ruler of Troy in the Trojan War.", "words": 60}, {"text": "[amused] Schliemann then did something no archaeologist would do today. [0.3s] He dressed his young Greek wife, Sophia, in the gold headdress and earrings and had her photographed, calling them the jewels of Helen of Troy. [0.4s] The photo went around the world and made him famous.", "words": 44}, {"text": "[surprised] There was just one problem. [0.3s] The treasure was around a thousand years too old to belong to Priam or Helen, if they ever existed at all. [0.5s] And some historians even suspect Schliemann gathered pieces from different spots and presented them as one dramatic find.", "words": 44}, {"text": "[serious] He smuggled the treasure out of the Ottoman Empire, and it ended up in a museum in Berlin. [0.3s] At the end of the Second World War, it disappeared, and for almost fifty years nobody outside Russia knew where it was. [0.4s] Then, in the 1990s, Russia revealed it had been sitting in a museum in Moscow all along, and that's where it still is today.", "words": 64}]}, {"t": "The griffin's gold (Scythians)", "c": [{"text": "[natural pace] [interest] Out on the grasslands north of the Black Sea lived the Scythians, horse-riding nomads who were obsessed with gold. [0.3s] With no cities and no palaces, they carried their wealth on their bodies and on their horses. [0.4s] Gold was their bank account, and they could ride away with it.", "words": 48}, {"text": "[curiosity] The Greek historian Herodotus wrote that further east, gold was guarded by griffins, monsters with the body of a lion and the head of an eagle. [0.3s] One modern historian has suggested the legend may have started when gold miners in Central Asia found dinosaur skeletons in the desert. [0.5s] So the monster guarding the gold may have been a real fossil.", "words": 60}]}, {"t": "Rome's war on jewellery (215 BC)", "c": [{"text": "[natural pace] [serious] Then came Rome, and one of the most famous jewellery protests in history. [0.3s] During a desperate war with Hannibal, after one of Rome's worst defeats ever, the government passed a law that no woman could own more than half an ounce of gold. [0.4s] The money was needed for the war, and wearing gold suddenly looked unpatriotic.", "words": 56}, {"text": "[determination] But twenty years later, the war was long won, and the law was still there. [0.3s] So the women of Rome poured into the streets and blocked the way to the Forum, demanding that it be repealed. [0.4s] A famous senator named Cato warned that if women won this fight, they would soon be ruling the men, and the law was thrown out anyway.", "words": 62}, {"text": "[interest] Rome also turned the ring into a symbol. [0.3s] For a long time, a gold ring was a privilege of senators and the upper class, while ordinary Romans wore iron. [0.4s] And when a Roman man got engaged, he gave his bride a ring, a tradition that's still with us today.", "words": 49}, {"text": "[thoughtful] And here's where that one finger comes in. [0.3s] An old belief, repeated by ancient writers, said a vein ran straight from the fourth finger of the left hand to the heart. [0.4s] It isn't true, but people loved the idea so much that in much of the world, the wedding ring has sat on that finger ever since.", "words": 57}, {"text": "[curiosity] Quick question before we keep going. [0.3s] Does your family have one piece of gold that's never sold, no matter how hard times get, maybe a ring, a chain or a bangle from a grandmother? [0.4s] Tell me in the comments what it is and who it came from, and if this story has surprised you so far, tap the like button, because it really helps this channel reach more people.", "words": 69}]}, {"t": "Why India loves gold", "c": [{"text": "[natural pace] [interest] But no country on Earth has a relationship with gold jewellery quite like India. [0.3s] At weddings, brides are often covered in it, from necklaces and bangles to earrings and the mangalsutra. [0.4s] And festivals like Dhanteras and Akshaya Tritiya are seen as lucky days to buy gold, so jewellery shops are packed every year.", "words": 53}, {"text": "[thoughtful] There's a reason behind it. [0.3s] For centuries, many women couldn't easily own land, so the gold they received at marriage, known as stridhan, became their own property. [0.4s] It was security they could wear, carry, and fall back on if life ever turned against them.", "words": 44}, {"text": "[curiosity] Take a guess how much gold is sitting inside Indian homes. [0.3s] By one widely quoted estimate, it's more than twenty-five thousand tonnes, more than the official reserves of the United States, Germany and the International Monetary Fund combined. [0.4s] And millions of families use it like a bank, pledging their jewellery for gold loans when money runs short and getting it back when times are better.", "words": 65}, {"text": "[surprised] Indian gold jewellery is also different. [0.3s] While much of the world wears eighteen karat gold, India prefers twenty-two karat, which is almost ninety-two percent pure and has that deep, rich yellow. [0.4s] Indian families want jewellery that's beautiful today, and still worth its weight in gold tomorrow.", "words": 46}]}, {"t": "The purity problem", "c": [{"text": "[natural pace] [cautious] But pure gold has a problem. [0.3s] It's so soft that a twenty-four karat ring can bend and scratch just from everyday wear, so jewellers mix in copper or silver to make it stronger. [0.4s] And because gold is so easy to mix, cheating buyers is as old as jewellery itself, which is why India made hallmarking compulsory for most gold jewellery in 2021.", "words": 62}, {"text": "[amused] The most famous purity test in history may have happened in a bathtub. [0.3s] According to an old story, a Greek king asked Archimedes to find out if his new golden crown had been secretly mixed with silver, without damaging it. [0.4s] Archimedes noticed the water rising as he got into his bath, realised he could measure the crown that way, and supposedly ran through the streets shouting eureka.", "words": 67}]}, {"t": "Gold jewellery today", "c": [{"text": "[natural pace] [serious] Which brings us back to 2025. [0.3s] Gold crossed four thousand dollars an ounce for the first time that year, and the price of a simple gold chain jumped with it. [0.4s] Around the world, people bought about eighteen percent less gold jewellery by weight, and in India it fell by about a quarter.", "words": 52}, {"text": "[surprised] And yet, the total spent on gold jewellery hit a record of about one hundred and seventy-two billion dollars. [0.4s] People didn't stop buying, they just bought lighter pieces and paid more for them. [0.5s] Even when it hurts, people would rather have a smaller piece of gold than no gold at all.", "words": 51}, {"text": "[thoughtful] Maybe that's because gold jewellery is the only investment you can wear to a wedding. [0.3s] Stocks can crash, banks can fail, and currencies can lose their value, but a gold bangle is still a gold bangle. [0.4s] It's art, it's savings and it's family memory, all in one piece.", "words": 48}]}, {"t": "Ending", "c": [{"text": "[thoughtful] So that's the story of gold jewellery. [0.3s] It began with shell beads in a Moroccan cave, then came the gold of Varna, a queen's headdress at Ur, the golden flies of Egypt, the lost treasure of Troy, the griffin's gold of the Scythians, and the women of Rome who fought for theirs. [0.4s] For six thousand years, gold has been the one thing people wanted to keep closest to their skin.", "words": 70}, {"text": "[awe] Remember that grave at Varna, where the gold still shines after six thousand years. [0.3s] The gold ring on someone's finger today will look just as bright long after every one of us is gone. [0.5s] And maybe that's exactly why we put it on the finger that was supposed to lead straight to the heart.", "words": 54}, {"text": "[positive] So here's my question for you. [0.3s] Is gold jewellery really an investment, or is it all about love and family? [0.4s] Tell me in the comments, and subscribe for the next long story.", "words": 32}]}], "words": 2305};
const KEY="vo-done-why-humans-became-obsessed-with-gold-jewellery";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
