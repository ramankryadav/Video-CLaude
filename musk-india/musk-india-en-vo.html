<script>
const D = {"secs": [{"t": "Cold open · The trillionaire and the tweet", "c": [{"text": "[natural pace] [bold] This is Elon Musk, the first trillionaire in human history. [0.3s] You probably think his new fight with India is just about a satellite internet licence. [0.4s] But in one single week of October 2026, that fight dragged in India's richest man, its opposition leader, and its government.", "words": 46}, {"text": "[sarcasm] He accused unnamed oligarchs of committing a crime against the people of India. [0.3s] He mockingly called Mukesh Ambani the Prime Minister of India. [0.4s] And when Rahul Gandhi joined in, the richest man on Earth publicly thanked him.", "words": 37}, {"text": "[serious] The government called his claims baseless, and a former minister warned that satellites come with serious security risks. [0.3s] At the very same time, police in Delhi were detaining young protesters who say India's voter lists are being manipulated. [0.5s] So the question millions of Indians are now asking is simple, is Elon Musk meddling in Indian politics?", "words": 56}, {"text": "[interest] It isn't only about Starlink, and it isn't only about Ambani. [0.3s] It's about power, and who gets to control how one point four billion people connect to the world. [0.4s] Now, let's take a closer look at the story of the trillionaire, the tycoon, and the fight for India's sky.", "words": 49}]}, {"t": "Five years of waiting (2021)", "c": [{"text": "[natural pace] [curiosity] Starlink is a network of thousands of satellites flying low around the Earth, beaming internet down to a small dish on your roof. [0.3s] It works in deserts, mountains and villages where no cable or mobile tower has ever reached. [0.4s] And India, with hundreds of millions of people still offline, looked like the biggest prize of all.", "words": 56}, {"text": "[sarcasm] In 2021, Starlink started taking pre-orders in India, and more than five thousand people paid a ninety-nine dollar deposit. [0.3s] There was just one small problem, it didn't have a licence. [0.4s] The government told people not to subscribe, Starlink had to refund everyone, and its India head stepped down soon after.", "words": 50}, {"text": "[interest] Then came the real battle, over something you can't even see, the radio spectrum that satellites use to talk to the ground. [0.3s] Ambani's Reliance Jio wanted that spectrum sold in an auction, where the biggest bidders win. [0.4s] Musk called that unprecedented, and in late 2024, the government sided with him and chose to allocate it instead.", "words": 56}, {"text": "[surprised] And then, the twist. [0.3s] In March 2025, Jio and Airtel, the two companies that should have feared Starlink most, signed deals to sell Starlink to their own customers. [0.4s] By the middle of 2025, Starlink had its licence and its space regulator's approval, and it looked like the door was finally open.", "words": 51}, {"text": "[frustrated] But the door never fully opened. [0.3s] Starlink, Jio's satellite arm and the Airtel backed OneWeb all still needed spectrum and a final security clearance, and month after month, nothing moved. [0.5s] So in October 2026, Elon Musk did what he always does when he loses patience, he went to X.", "words": 49}]}, {"t": "The week of the tweets (October 2026)", "c": [{"text": "[natural pace] [serious] On October seventh, Musk wrote that Starlink was being blocked by certain oligarchs, to protect what he called their monopolistic chokehold on the Indian people. [0.3s] He didn't name anyone, but he said you can guess who they are. [0.4s] And he called it a crime against the people of India.", "words": 49}, {"text": "[authoritative] The next day, India's communications ministry hit back, calling the claim baseless and misconceived. [0.3s] It said all three satellite companies were at broadly the same regulatory stage, and that security checks had to come first. [0.4s] Musk answered with a question that exploded across Indian social media, is Ambani the real boss of India?", "words": 53}, {"text": "[surprised] Then the opposition walked in. [0.3s] Rahul Gandhi, India's Leader of the Opposition, welcomed Musk to India and told him to wait until he discovered the other guy, a line many read as a jab at another tycoon, Gautam Adani. [0.4s] Musk thanked him, and called the situation indeed troubling.", "words": 48}, {"text": "[cautious] Former minister Rajeev Chandrasekhar, from the ruling B J P, fired back that patience was a necessity. [0.3s] He warned that satellite internet carries serious security risks in a country that has faced years of terror and insurgency. [0.4s] And he mocked Rahul Gandhi as Musk's latest fan.", "words": 46}, {"text": "[sarcasm] On October ninth, Musk went even further. [0.3s] In a post addressed to Dear Prime Minister Ambani, he apologized for not realizing that Ambani was the real boss of India, and asked if he would please allow Starlink to compete. [0.4s] Communications minister Jyotiraditya Scindia answered that India does not allow a monopoly in any sector.", "words": 54}, {"text": "[thoughtful] By October eleventh, Musk was promising an affordable Starlink, and saying Ambani's profits would be lower, but he wouldn't go out of business. [0.3s] To some Indians, he looked like a hero taking on a giant. [0.5s] To others, he looked like a foreign billionaire trying to bully an elected government in public.", "words": 51}]}, {"t": "The Ambani empire (1958)", "c": [{"text": "[natural pace] [interest] Now, you're probably thinking the answer is obvious. [0.3s] Ambani owns Jio, Jio wants to launch its own satellite internet, and no business wants a rival as powerful as Musk. [0.4s] And to understand why that idea feels so believable to so many Indians, you have to know how the Ambanis built their empire.", "words": 52}, {"text": "[admiration] Enter Dhirubhai Ambani, a schoolteacher's son from Gujarat who reportedly started out as a petrol station attendant in Aden, in Yemen. [0.3s] In 1958, he came back to Bombay and started trading yarn and spices with very little money. [0.4s] Within a few decades, Reliance had become one of the biggest companies in India.", "words": 52}, {"text": "[cautious] This was the era of the licence raj, when you needed government permission for almost everything. [0.3s] Critics, and a famous biography called The Polyester Prince, claimed Reliance was unusually good at getting rules bent in its favour, claims the Ambanis always disputed. [0.4s] That book was never officially released in India after legal threats, but the reputation it described never fully went away.", "words": 62}, {"text": "[surprised] Then, in 2016, his son Mukesh did something nobody had seen before. [0.3s] He launched Jio and gave away calls and mobile data for free, for months. [0.4s] By the company's own count, Jio reached a hundred million users in about a hundred and seventy days, one of the fastest growth stories in business history.", "words": 53}, {"text": "[serious] Rivals bled money, and the market shrank to a handful of survivors. [0.3s] Before Jio, around a dozen mobile companies fought for Indian customers, and today Jio and Airtel together control more than eighty percent of the market. [0.4s] Airtel accused Jio of predatory pricing, but India's competition regulator rejected that complaint in 2017.", "words": 52}, {"text": "[thoughtful] Here's the part both sides agree on. [0.3s] A gigabyte of mobile data cost Indians around two hundred and seventy rupees in 2014, and by 2020 it cost about eleven, which brought hundreds of millions of people online. [0.4s] But in 2024, with only a few players left, Jio raised its prices by up to twenty-seven percent, and its rivals followed within days.", "words": 61}, {"text": "[curiosity] Now Jio reportedly wants the sky too, with plans for a satellite network of its own, and on October twenty-first, it's expected to open India's biggest stock market listing ever. [0.3s] Remember that date, because it matters more than it looks. [0.5s] So yes, Ambani has a lot to lose, but if you only look at Ambani, you miss the bigger picture.", "words": 60}]}, {"t": "The Musk playbook (2022)", "c": [{"text": "[natural pace] [serious] To see that picture, look at what Musk has done in other countries. [0.3s] In 2022, he bought Twitter for forty-four billion dollars, renamed it X, and became the owner of one of the most powerful political megaphones on the planet. [0.4s] He called himself a free speech absolutist, and he started using that megaphone himself, every single day.", "words": 57}, {"text": "[authoritative] In America's 2024 election, Musk didn't just post. [0.3s] According to federal election filings, he spent more than two hundred and ninety million dollars backing Donald Trump and other Republicans, including a giveaway of a million dollars a day to swing state voters who signed his petition. [0.4s] After Trump won, Musk was handed a government cost-cutting team, and within months, the two men had a very public falling out.", "words": 68}, {"text": "[cautious] In Brazil, he refused court orders to block certain accounts, and called a Supreme Court judge a dictator. [0.3s] In 2024, Brazil switched off X across the entire country for more than a month, until the company backed down. [0.4s] It was a foreign businessman against a nation's highest court, and the court won.", "words": 52}, {"text": "[serious] In Germany, he openly backed the far-right Alternative for Germany party before the 2025 election, and even spoke by video to one of its rallies. [0.3s] In Britain, he called for Parliament to be dissolved, and told an anti-immigration rally that violence was coming, and that they had to fight back or die. [0.4s] Politicians across Britain condemned those words as dangerous.", "words": 60}, {"text": "[awe] And then there's the switch. [0.3s] In 2022, during the war in Ukraine, Musk refused a request to turn on Starlink near Crimea, a request he said would have been used to attack the Russian fleet. [0.5s] Think about how strange that is, a private businessman holding a switch that could shape a war.", "words": 52}, {"text": "[thoughtful] So here's the pattern. [0.3s] Musk picks a side in another country's political fight, posts about it to more than two hundred million followers, and dares the government to respond. [0.4s] His fans call it fighting censorship, and his critics call it a billionaire meddling in democracies that never voted for him.", "words": 50}]}, {"t": "Musk and India (2015)", "c": [{"text": "[natural pace] [positive] With India, it started as a friendship. [0.3s] In 2015, Narendra Modi visited Tesla's factory in California, and in 2023, after meeting him again in New York, Musk said he was a fan of Modi. [0.4s] He promised that Tesla would come to India as soon as humanly possible.", "words": 47}, {"text": "[frustrated] Then the cracks appeared. [0.3s] X took the Indian government to court over its content blocking orders, saying it had already obeyed ninety-one percent of more than twenty-nine thousand takedown requests. [0.4s] In 2025, the Karnataka High Court ruled against X, and the company appealed.", "words": 43}, {"text": "[amused] That same year, X's chatbot, Grok, started answering Indian users in Hindi slang, and making cheeky comments about Modi and Rahul Gandhi. [0.3s] India's technology ministry said it was talking to X about it. [0.4s] It looked like a joke, but it was a reminder that Musk's machines were now part of India's political conversation.", "words": 53}, {"text": "[cautious] Back in 2024, security forces in Manipur had seized Starlink equipment alongside weapons, even though Musk says Starlink's beams are switched off over India. [0.3s] And in May 2026, after years of arguing over import taxes, Tesla officially dropped its plan to build a factory in India. [0.5s] So by the time Musk called Ambani the real boss of India, the friendship had already gone cold.", "words": 64}]}, {"t": "The anger on India's streets (2026)", "c": [{"text": "[natural pace] [serious] Now look at what's happening inside India right now. [0.3s] In May 2026, India's Chief Justice made a remark that seemed to compare some activists and unemployed young people to cockroaches, which he later said was about people with fake degrees. [0.4s] The very next day, a young activist named Abhijeet Dipke launched a satirical movement called the Cockroach Janta Party.", "words": 59}, {"text": "[interest] It began as a joke, but it caught the anger of millions of young Indians about jobs, prices and who really runs the country. [0.3s] Then it found a bigger target, a nationwide revision of voter lists that removed millions of names. [0.4s] The Election Commission says it's removing dead and duplicate voters, but the movement says it's choosing who gets to vote, and wants the Chief Election Commissioner to resign.", "words": 69}, {"text": "[serious] Rahul Gandhi joined that demand. [0.3s] And on October tenth, the very same week as Musk's posts, the movement called people to Jantar Mantar in Delhi. [0.4s] Police reportedly put more than sixty thousand security personnel on the streets, and detained the movement's three leaders from inside their plane after it landed.", "words": 50}, {"text": "[cautious] Reports said opposition leaders including Arvind Kejriwal and Mamata Banerjee were also detained, and a popular YouTuber was reportedly placed under house arrest. [0.3s] The ruling B J P called the protest a flop show, and police said the protest site itself stayed clear. [0.4s] The protesters say they were silenced, the government says it kept order, and the movement has promised to keep going.", "words": 63}]}, {"t": "The perfect storm", "c": [{"text": "[natural pace] [curiosity] Now put the two stories side by side. [0.3s] On one side, a young, angry country, with an opposition leader attacking the government over elections and big business. [0.4s] On the other side, a trillionaire with a global megaphone, attacking the same government over the same tycoons, in the very same week.", "words": 50}, {"text": "[thoughtful] To be clear, there's no public evidence that Musk has said a word about these protests. [0.3s] But critics in India warn that this is exactly the kind of moment an outsider with a huge platform can use, when a country is already divided. [0.4s] One post, amplified to hundreds of millions of people, can pour fuel on a fire that's already burning.", "words": 61}, {"text": "[cautious] Musk's supporters see it very differently. [0.3s] They say he's a businessman who waited five years, and simply said out loud what many Indians already suspect about crony capitalism. [0.5s] So is he a whistleblower, or is he a player?", "words": 38}]}, {"t": "What a trillionaire wants", "c": [{"text": "[natural pace] [awe] In June 2026, SpaceX went public at a value of about one point eight trillion dollars, and Musk became the first trillionaire in history. [0.3s] He owns the rockets, the satellites, the social network, and an artificial intelligence company. [0.4s] No private citizen has ever controlled this many of the pipes that information flows through.", "words": 53}, {"text": "[serious] And for someone who already has everything money can buy, many analysts argue that what's left is influence. [0.3s] Remember the switch over Crimea. [0.4s] Now imagine that same kind of switch over a country where hundreds of millions of people could one day get their internet from the sky.", "words": 48}, {"text": "[interest] That's why India's government keeps repeating one word, security. [0.3s] At least four in ten Indians are still not online, the last giant internet market left on Earth, and whoever connects them could shape what they see, read and believe. [0.4s] And remember October twenty-first, the day Ambani's Jio is expected to hit the stock market, because Musk's attacks landed just days before it.", "words": 62}]}, {"t": "The verdict is yours", "c": [{"text": "[natural pace] [thoughtful] So that's the story. [0.3s] Not just a delayed licence, but a five-year fight over the sky, a tycoon who rewrote India's telecom market, and a trillionaire who has stepped into politics from America to Brazil, Germany and Britain. [0.4s] And now, in a tense week for Indian democracy, his posts landed right in the middle of it.", "words": 56}, {"text": "[curiosity] Starlink could bring the internet to villages that have waited decades for it, and more competition could push prices down for everyone. [0.3s] But a country also has to ask who it's letting in, and what they want in return. [0.5s] So what do you think, is Elon Musk meddling in Indian politics, or is he just a businessman who ran out of patience?", "words": 62}, {"text": "[positive] Tell me in the comments, and keep it respectful, because both sides have a point. [0.3s] If you want the full story behind the headlines, the long version and not the clip, this channel is for you. [0.4s] Subscribe for the next long story.", "words": 42}]}], "words": 2402};
const KEY="vo-done-is-the-world-s-first-trillionaire-meddling-in-in";

const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};

const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);

});
