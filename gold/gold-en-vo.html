<style>
/* Layout: a sticky progress bar over one column of numbered cards, one Vids chunk per card */
:root{
  --paper:#f6f4ee; --sheet:#fffefa; --ink:#1e2230; --muted:#6a6c76; --rule:#d9d5c9;
  --pen:#2340a8; --brick:#a3412b; --tagbg:#e6e9f7; --pausebg:#f1e6df; --done:#2f7a4f; --donebg:#eaf3ec;
  --display:"Zilla Slab",Rockwell,Georgia,serif; --body:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);padding-inline:16px;padding-block:24px 80px;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:700 clamp(24px,4.4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:18px 0 0;text-wrap:balance;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h2 small{font:400 12px var(--mono);color:var(--muted)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.lede{margin:0;color:var(--muted);max-width:64ch;font-size:15.5px}
.rules{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12.5px/1.5 var(--mono);color:var(--muted)}
.rules b{color:var(--ink);font-weight:500}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:5px}
.prog .lbl{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--done);width:0;transition:width .25s}
button{font:500 12.5px/1 var(--mono);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;border-radius:3px;cursor:pointer}
button:hover{color:var(--pen);border-color:var(--pen)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
label.tg{font:400 12.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.card{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:0}
.card .num{font:500 13px var(--mono);color:var(--brick);padding:14px 12px;border-right:2px dashed var(--rule);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;align-items:center}
.card .body{padding:12px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.txt{margin:0;max-width:66ch}
.tag{font:500 12.5px var(--mono);background:var(--tagbg);color:var(--pen);padding:1px 5px;border-radius:2px;white-space:nowrap}
.tag.p{background:var(--pausebg);color:var(--brick)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.row .acts{display:flex;gap:12px;align-items:center}
.card.done{background:var(--donebg);border-color:var(--done)}
.card.done .txt{opacity:.6}
.card.done .num{color:var(--done)}
body.hidedone .card.done{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 13px var(--mono);padding:9px 14px;border-radius:3px}
textarea.fb{width:100%;height:110px;font:13px var(--mono);background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
@media (max-width:480px){.card{grid-template-columns:1fr}.card .num{flex-direction:row;border-right:0;border-bottom:2px dashed var(--rule);padding:8px 14px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <span class="eyebrow">Google Vids voiceover · Zeno</span>
    <h1>The ENTIRE History of Gold in 15 Minutes</h1>
    <p class="lede" id="lede"></p>
    <div class="rules"><span><b>Pace</b> natural only</span><span><b>Pauses</b> 0.3 s to 0.5 s, written as a number</span><span><b>No</b> whisper, slow, rushed, short, medium or long pause tags</span><span><b>Box</b> 3 sentences each</span></div>
  </header>
  <div class="sticky">
    <div class="prog"><span class="lbl" id="plbl"></span><div class="track"><div class="fill" id="pfill"></div></div></div>
    <button type="button" id="next">Jump to next</button>
    <label class="tg" for="hide"><input type="checkbox" id="hide"> Hide done</label>
    <button type="button" id="reset">Reset</button>
  </div>
  <main id="list" style="display:flex;flex-direction:column;gap:12px"></main>
</div>

<script>
const D = {"secs": [{"t": "Cold open · The metal we never stopped chasing", "c": [{"text": "[natural pace] [bold] This is gold. [0.3s] You probably think it's just a shiny metal for rings, necklaces and wedding jewellery. [0.4s] But for six thousand years, this soft yellow metal has started wars, toppled empires, and decided what money actually is.", "words": 37}, {"text": "[sarcasm] An ancient king asked an oracle about his future, and lost his entire kingdom. [0.3s] An African emperor went on a pilgrimage and crashed the price of gold in Cairo for years. [0.4s] And the most powerful country on Earth once made it a crime for its own citizens to keep it.", "words": 50}, {"text": "[serious] Gold never rusts, you can't eat it, and it's too soft to make a good tool. [0.3s] And yet, all the gold ever mined would fit into a single cube about seventy-four feet on each side. [0.5s] Remember that cube, because by the end of this story, you'll understand why nations still fight over every ounce of it.", "words": 56}, {"text": "[interest] It wasn't its beauty that made gold so powerful, and it wasn't its rarity alone. [0.3s] It was trust, because gold is the one thing almost every civilization agreed was valuable. [0.4s] Now, let's take a closer look at the six thousand year story of the metal that ruled the world.", "words": 49}]}, {"t": "Born in dying stars", "c": [{"text": "[natural pace] [awe] Before any human touched gold, the universe had to make it. [0.3s] Many scientists now believe most of the gold in the universe was forged when two dead stars, called neutron stars, smashed into each other. [0.4s] In 2017, astronomers watched one of these crashes for the first time, and by one estimate it created heavy metals weighing more than a thousand Earths.", "words": 61}, {"text": "[thoughtful] When the Earth formed, most of its gold sank deep into the molten core. [0.3s] Much of the gold we mine today is thought to have arrived later, delivered by meteorites that bombarded the young planet. [0.4s] So the gold in your ring is older than the Earth itself, and it may have come from space.", "words": 54}]}, {"t": "The first gold (4600 BC)", "c": [{"text": "[natural pace] [curiosity] For most of human history, gold was simply something shiny people found in rivers. [0.3s] It doesn't need to be smelted like iron, because it often sits in streams as pure flakes and nuggets. [0.4s] And because it's so soft, early humans could hammer it into shapes with nothing but stones.", "words": 49}, {"text": "[surprised] In 1972, a worker digging a trench near the city of Varna, in Bulgaria, hit something buried in the ground. [0.3s] It was a cemetery more than six thousand years old, full of gold bracelets, beads and ornaments. [0.4s] Today, it's considered the oldest large treasure of worked gold ever found.", "words": 49}, {"text": "[interest] One grave, known simply as grave forty-three, held a man buried with hundreds of gold objects. [0.3s] Archaeologists say it held more gold than has been found anywhere else in the world from that era. [0.4s] Six thousand years ago, gold was already doing what it still does today, showing who mattered.", "words": 50}]}, {"t": "Flesh of the gods (ancient Egypt)", "c": [{"text": "[natural pace] [awe] Then came the civilization that took gold more seriously than any before it, ancient Egypt. [0.3s] Egyptians called gold the flesh of the gods, because it never tarnished, just as the gods never died. [0.4s] Their sun god, Ra, was said to have skin made of gold.", "words": 45}, {"text": "[interest] Egypt's gold came largely from the deserts to the south, in a region called Nubia. [0.3s] Pharaohs sent expeditions and armies to control those mines, and prisoners and slaves did the brutal work under the desert sun. [0.4s] Gold made Egypt one of the richest powers of the ancient world.", "words": 48}, {"text": "[awe] In 1922, an archaeologist named Howard Carter found the tomb of a young pharaoh, Tutankhamun. [0.3s] Inside, the boy king lay in a coffin made of solid gold, weighing about two hundred and forty pounds. [0.4s] And Tutankhamun was a minor king, which makes you wonder what the tombs of the great pharaohs once held.", "words": 53}, {"text": "[cautious] The answer is that most of them were robbed, many of them in ancient times. [0.3s] Tomb raiders, sometimes even the workers who built the tombs, stripped them of their gold. [0.4s] Gold was simply too valuable to stay buried, even with a god-king.", "words": 42}]}, {"t": "As rich as Croesus (600 BC)", "c": [{"text": "[natural pace] [curiosity] For thousands of years, people traded gold by weight, which meant weighing and testing every single lump. [0.3s] Then, in a kingdom called Lydia, in what is now western Turkey, someone had a brilliant idea. [0.4s] What if a king stamped small pieces of metal with his mark, and guaranteed their value?", "words": 50}, {"text": "[interest] Around the seventh century before Christ, Lydia began making some of the first coins in history, from a natural mix of gold and silver. [0.3s] Its most famous king, Croesus, is often credited with the first coins of nearly pure gold. [0.4s] His wealth became so legendary that people still say someone is as rich as Croesus.", "words": 55}, {"text": "[sarcasm] But Croesus wanted more. [0.3s] According to the Greek historian Herodotus, he asked the famous oracle at Delphi whether to attack the mighty Persian Empire, and the oracle said that if he did, he would destroy a great empire. [0.4s] Croesus was thrilled, and he marched to war.", "words": 46}, {"text": "[thoughtful] And then, the twist. [0.3s] The great empire that fell was his own. [0.5s] The Persians took his capital, and the gold of Lydia now belonged to a new empire, which kept right on minting coins.", "words": 34}]}, {"t": "Rome's golden coin", "c": [{"text": "[natural pace] [authoritative] Coins spread across the ancient world, and the Romans turned them into a system that ran an empire. [0.3s] Rome paid its soldiers and officials in gold and silver coins. [0.4s] But over time, emperors found a dangerous shortcut, they mixed cheaper metals into the coins.", "words": 44}, {"text": "[frustrated] It worked for a while, because emperors could pay for more with the same amount of real metal. [0.3s] But people noticed, prices rose, and by the late third century the main silver coin was reportedly only a tiny fraction silver. [0.4s] It's one of history's earliest examples of a government quietly shrinking the value of its own money.", "words": 57}, {"text": "[admiration] Then, in the early fourth century, Emperor Constantine introduced a new gold coin called the solidus. [0.3s] Its gold content stayed steady for around seven hundred years. [0.4s] Historians sometimes call it the dollar of the Middle Ages, because it was trusted far beyond the empire's borders.", "words": 45}]}, {"t": "The king who crashed gold (1324)", "c": [{"text": "[natural pace] [curiosity] Fast forward to West Africa in the fourteenth century, where the Mali Empire controlled some of the richest gold fields on Earth. [0.3s] Its ruler was Mansa Musa, often described as one of the richest people who ever lived. [0.4s] In 1324, he set out on a pilgrimage to Mecca.", "words": 48}, {"text": "[awe] According to Arab chroniclers, he travelled with thousands of people and camels loaded with gold. [0.3s] When his caravan reached Cairo, he gave gold away so generously, and his people spent so much of it, that the city was flooded with it. [0.4s] The writer al-Umari reported that the price of gold in Egypt fell, and still hadn't recovered twelve years later.", "words": 60}, {"text": "[amused] Think about how strange this is. [0.3s] One man's trip was enough to shake the economy of one of the biggest cities in the world. [0.4s] It also put Mali on European maps, where a famous fourteenth century atlas shows Mansa Musa holding a lump of gold.", "words": 45}]}, {"t": "The conquest of gold (1532 to 1600)", "c": [{"text": "[natural pace] [serious] In 1492, Christopher Columbus reached the Americas, and the Spanish who followed were obsessed with one thing, gold. [0.3s] They chased the legend of El Dorado, which reportedly began with a chief covered in gold dust, and grew into a lost city of gold. [0.4s] It was never found, because it never existed.", "words": 51}, {"text": "[cautious] In 1532, a small Spanish force led by Francisco Pizarro captured the Inca emperor, Atahualpa. [0.3s] To win his freedom, Atahualpa offered to fill a large room with gold once, and with silver twice, as high as he could reach. [0.4s] For months, gold poured in from across the Inca Empire.", "words": 49}, {"text": "[frustrated] The Spanish melted down priceless Inca art into bars, an estimated six tons of gold. [0.3s] Then, in 1533, they executed Atahualpa anyway. [0.4s] The room he promised to fill still stands today, in the Peruvian city of Cajamarca.", "words": 37}, {"text": "[surprised] Over the next century, enormous amounts of gold and silver flowed from the Americas to Spain. [0.3s] But here's the twist, all that precious metal pushed prices up across Europe, while Spain spent it on endless wars. [0.5s] The richest empire on the planet defaulted on its debts again and again.", "words": 49}]}, {"t": "Newton's gold (1717)", "c": [{"text": "[natural pace] [curiosity] For centuries, alchemists tried to turn cheap metals into gold, and one of them was a man you might not expect, Isaac Newton. [0.3s] The genius behind gravity spent years secretly writing about alchemy. [0.4s] He never made gold, but he ended up changing the way gold was used as money.", "words": 49}, {"text": "[interest] In 1696, Newton went to work at the Royal Mint in London, and he later became its Master. [0.3s] In 1717, he set the value of the gold guinea coin at twenty-one shillings, which made gold slightly overvalued compared to silver. [0.4s] Silver coins slowly disappeared from circulation, and Britain drifted onto gold.", "words": 51}, {"text": "[thoughtful] Newton had been solving a coin shortage, not designing a new world system. [0.3s] But by the nineteenth century, Britain had officially tied its money to gold, and as the British Empire grew, much of the world followed. [0.4s] The gold standard was born.", "words": 42}]}, {"t": "The gold rushes (1848 to 1886)", "c": [{"text": "[natural pace] [excited] On January twenty-fourth, 1848, a carpenter named James Marshall noticed something shiny in the water at a sawmill in California. [0.3s] It was gold, and within months the news had spread across the world. [0.4s] Hundreds of thousands of people rushed to California, hoping to get rich overnight.", "words": 46}, {"text": "[sarcasm] San Francisco exploded from a small town of about a thousand people into a city of tens of thousands within a few years. [0.3s] Most miners found very little, and many went home broke. [0.4s] The people who got rich were often the ones selling shovels, food and clothes to the miners.", "words": 50}, {"text": "[thoughtful] And the man who owned that sawmill, John Sutter, was ruined. [0.3s] His workers quit to go digging, and squatters took over his land. [0.4s] He spent the rest of his life asking the government for compensation, and he never received it.", "words": 40}, {"text": "[awe] Then, in 1886, prospectors found gold along a long ridge in South Africa called the Witwatersrand. [0.3s] It turned out to be the biggest gold deposit ever discovered, and by some estimates it has produced as much as a third of all the gold ever mined. [0.4s] The mining camp built on top of it grew into the city of Johannesburg.", "words": 59}]}, {"t": "The gold standard (1933 to 1971)", "c": [{"text": "[natural pace] [serious] By the early twentieth century, most major currencies were backed by gold, which meant that, in theory, you could swap paper money for metal. [0.3s] Then came the Great Depression, and panicked people pulled gold out of the banks. [0.4s] In 1933, President Franklin Roosevelt did something shocking.", "words": 46}, {"text": "[surprised] He ordered Americans to hand most of their gold coins and bars to the government, at twenty dollars and sixty-seven cents an ounce. [0.3s] Hoarding gold became a crime, punishable by up to ten years in prison. [0.4s] Then, in 1934, the government raised the official price to thirty-five dollars, instantly making its new gold stockpile worth far more.", "words": 57}, {"text": "[authoritative] Remember that number, thirty-five dollars an ounce, because it comes back later. [0.3s] In 1944, near the end of the Second World War, the Allies met at Bretton Woods, in New Hampshire, and tied the world's currencies to the United States dollar. [0.4s] And the dollar was tied to gold, at exactly thirty-five dollars an ounce.", "words": 54}, {"text": "[interest] Much of that gold ended up in American vaults, including the famous Fort Knox in Kentucky. [0.3s] But other countries could still swap their dollars for American gold, and by the late 1960s, they were doing exactly that. [0.4s] The United States had printed far more dollars than it had gold to back them.", "words": 52}, {"text": "[thoughtful] On August fifteenth, 1971, President Richard Nixon went on television and announced that the dollar would no longer be convertible into gold. [0.3s] He said the suspension was temporary. [0.5s] It has never been reversed, and today no major currency in the world is backed by gold.", "words": 45}]}, {"t": "The price of fear (1971 to today)", "c": [{"text": "[natural pace] [excited] Freed from its fixed price, gold went wild. [0.3s] In the 1970s, inflation soared, oil prices exploded, and in January 1980 gold hit about eight hundred and fifty dollars an ounce. [0.4s] That's more than twenty-four times the old price of thirty-five dollars, in less than nine years.", "words": 46}, {"text": "[serious] Gold also became the last line of defence for countries in trouble. [0.3s] In 1991, India was running out of foreign currency, with enough reserves for only a few weeks of imports. [0.4s] So the government pledged around sixty-seven tonnes of its gold, much of it flown to the Bank of England, to borrow the money it needed.", "words": 56}, {"text": "[interest] And gold never really left Indian homes. [0.3s] Indian households are estimated to own around twenty-five thousand tonnes of gold, roughly one ninth of all the gold ever mined. [0.4s] For many families, it's passed down at weddings and festivals, and it's seen as the safest savings of all.", "words": 47}, {"text": "[cautious] Meanwhile, central banks started buying gold again. [0.3s] In 2022 and 2023, they bought more than a thousand tonnes each year, the fastest pace in decades. [0.4s] Countries worried about wars, sanctions and the dollar wanted an asset that no other government could print.", "words": 42}, {"text": "[surprised] Then, on January twenty-ninth, 2026, gold closed at a record of more than five thousand three hundred dollars an ounce. [0.3s] That's more than one hundred and fifty times the old price of thirty-five dollars. [0.5s] And then, almost as fast, it fell by about a fifth by early October.", "words": 48}, {"text": "[thoughtful] And remember that cube, seventy-four feet on each side. [0.3s] Nearly all the gold ever mined still exists, because gold doesn't rot, rust or disappear. [0.4s] The gold in a phone, a wedding ring or a central bank vault today might once have been a pharaoh's treasure or a Roman coin.", "words": 49}]}, {"t": "Ending", "c": [{"text": "[thoughtful] So that's gold. [0.3s] A metal born in the crash of dead stars, buried with a man in Bulgaria, worshipped in Egypt, stamped into coins by Croesus, stolen from the Inca, and locked away in vaults. [0.4s] Empires rose and fell around it, but the gold itself never changed.", "words": 47}, {"text": "[natural pace] [curiosity] This is history, not financial advice, and nobody knows where the price goes next. [0.4s] So what do you think will happen to gold in the next fifty years? [0.3s] Tell me in the comments, and subscribe for the next long story.", "words": 40}]}], "words": 2279};
const KEY="vo-done-the-entire-history-of-gold-in-15-minutes";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
