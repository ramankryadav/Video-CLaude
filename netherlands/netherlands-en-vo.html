<style>

body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);padding-inline:16px;padding-block:24px 80px;margin:0}

<div class="wrap">

<script>
const D = {"secs": [{"t": "Cold open · The country that shouldn't exist", "c": [{"text": "[natural pace] [bold] This is the Netherlands. [0.3s] You probably think it's just a small, flat country of windmills, tulips and bicycles, tucked into the corner of Europe. [0.4s] But by the normal rules of geography, a huge part of this country should be at the bottom of the sea.", "words": 45}, {"text": "[sarcasm] A Roman writer visited and said the locals lived like shipwrecked sailors on piles of dirt. [0.3s] The sea answered the first dikes by swallowing whole villages in a single night. [0.4s] And when enemies invaded, the Dutch did something no sane country would do, they drowned their own land on purpose.", "words": 50}, {"text": "[serious] Today, about a quarter of the country lies below sea level, and more than half of it could flood. [0.3s] Millions of people sleep every night behind walls of sand, clay and concrete. [0.5s] And yet this tiny, sinking country became one of the richest places on the planet.", "words": 47}, {"text": "[interest] It wasn't luck that saved the Netherlands, and it wasn't its kings. [0.3s] It was mud, wind, and a stubborn habit of working together against the water. [0.4s] Now, let's take a closer look at the story of the country people built with their own hands.", "words": 44}]}, {"t": "The problem", "c": [{"text": "[natural pace] [natural] Look at a map of Europe, and the Netherlands sits where three great rivers, the Rhine, the Meuse and the Scheldt, reach the North Sea. [0.3s] For thousands of years, those rivers dumped sand and mud here, building a soggy delta of marshes, peat bogs and islands. [0.4s] It was land, technically, but only until the next storm.", "words": 56}, {"text": "[cautious] The North Sea is shallow, and when strong winds blow from the northwest, they push its water straight toward this coast. [0.3s] Add a high tide, and the sea can rise many feet in a matter of hours. [0.4s] For a flat country with no mountains to run to, that is a nightmare.", "words": 51}, {"text": "[awe] The lowest point in the country, a polder near Rotterdam, sits about twenty-two feet below sea level. [0.3s] Remember that place, because it comes back later. [0.5s] As an old saying goes, God created the world, but the Dutch created the Netherlands.", "words": 40}]}, {"t": "The mound people (500 BC)", "c": [{"text": "[natural pace] [curiosity] The first people to live here didn't fight the water at all. [0.3s] Around five hundred years before Christ, families in the far north began piling up mounds of earth, clay and manure, and building their houses on top. [0.4s] These mounds are called terps, and some of them grew taller and wider for centuries.", "words": 53}, {"text": "[amused] In the first century, the Roman writer Pliny the Elder came to this coast and was not impressed. [0.3s] He described a poor people living on high mounds, like sailors when the tide came in, and like castaways when it went out. [0.4s] He even wrote that nobody could tell whether this region belonged to the land or to the sea.", "words": 59}]}, {"t": "Dikes and the water boards (1000 to 1300)", "c": [{"text": "[natural pace] [determination] Around the year one thousand, people stopped just hiding from the water and started pushing it back. [0.3s] They built dikes, long walls of earth, around their fields, and dug ditches to drain the wet peat inside. [0.4s] A piece of land enclosed like this is called a polder, and the whole country would slowly become a patchwork of them.", "words": 58}, {"text": "[interest] But a dike is only as strong as its weakest stretch. [0.3s] If one farmer let his part of the wall crumble, everyone behind it drowned, rich or poor. [0.4s] So neighbours were forced to organize, and they created something remarkable, the water boards.", "words": 42}, {"text": "[admiration] In 1255, the count of Holland gave a charter to the water board of Rijnland, which still exists today. [0.3s] Water boards collected taxes, inspected dikes, and gave ordinary landowners a say in how things were run. [0.4s] Some historians argue this habit of compromise shaped Dutch politics for centuries.", "words": 48}]}, {"t": "The sea strikes back (1287 to 1421)", "c": [{"text": "[natural pace] [serious] But draining peat has a terrible side effect. [0.3s] As the water leaves, the peat dries out, shrinks and rots away, and the land slowly sinks. [0.4s] The more the Dutch drained their fields, the lower those fields became, and the more dangerous the sea became.", "words": 44}, {"text": "[cautious] In December 1287, a massive storm surge known as Saint Lucia's flood smashed through the coast. [0.3s] An estimated fifty to eighty thousand people died, making it one of the deadliest floods in recorded history. [0.4s] The sea tore open a huge inland bay that would be called the Zuiderzee, the southern sea.", "words": 51}, {"text": "[frustrated] Then, in November 1421, came Saint Elizabeth's flood. [0.3s] Dikes in the rich farming region of the Grote Waard broke, and according to legend, dozens of villages vanished under the water. [0.4s] Estimates of the dead range from two thousand to ten thousand people.", "words": 42}]}, {"t": "The windmills (1400s to 1612)", "c": [{"text": "[natural pace] [hope] And then, the Dutch found an ally in the very thing that drove the storms, the wind. [0.3s] By the fifteenth century, they were building windmills not to grind grain, but to pump water out of their polders. [0.4s] Each mill turned a giant wheel or screw that lifted water over the dike and into a canal.", "words": 55}, {"text": "[interest] One mill could only lift water a short way, so engineers lined them up in rows, each one passing the water to the next, like a staircase. [0.3s] It sounds simple, but it changed everything. [0.5s] For the first time, the Dutch could not just protect land, they could make brand new land out of lakes.", "words": 54}, {"text": "[admiration] Enter Jan Adriaanszoon Leeghwater, a mill builder whose last name, fittingly, means empty water. [0.3s] Rich Amsterdam merchants paid to drain an entire lake called the Beemster, and Leeghwater helped place about forty windmills around it. [0.4s] By 1612, the lakebed had become a perfect grid of farms and roads, now a UNESCO World Heritage Site.", "words": 54}]}, {"t": "Drowning your own country (1574 to 1672)", "c": [{"text": "[natural pace] [serious] In the sixteenth century, the Low Countries were ruled by the king of Spain, and in 1568 a revolt broke out that would last eighty years. [0.3s] Spain had one of the most powerful armies in Europe. [0.4s] The Dutch rebels had something else, water.", "words": 43}, {"text": "[cautious] In 1574, Spanish troops surrounded the city of Leiden, and for months the people inside starved. [0.3s] So the rebel leader, William of Orange, made a terrifying decision, he ordered the dikes cut and the countryside flooded. [0.4s] Farms that families had protected for generations disappeared under the water, on purpose.", "words": 49}, {"text": "[determination] Slowly, the water spread toward the city, and rebel sailors called the Sea Beggars pushed their flat-bottomed boats across the flooded fields. [0.3s] On October third, 1574, they reached Leiden with food, and the Spanish army pulled back. [0.4s] The city still celebrates that day every single year.", "words": 46}, {"text": "[surprised] A century later, in 1672, it happened again. [0.3s] The armies of the French king, Louis the Fourteenth, overran much of the Dutch Republic in weeks, in what the Dutch still call the disaster year. [0.4s] So the Dutch flooded a long strip of land in front of Holland, too deep to march through, but too shallow for boats.", "words": 57}, {"text": "[thoughtful] The French army stopped at the edge of the water and couldn't go further. [0.3s] That winter, they tried to cross on the ice, but a sudden thaw reportedly turned it back to slush. [0.4s] The Dutch Water Line became a weapon that the country would keep for centuries.", "words": 47}]}, {"t": "The lake that ate ships (1640s to 1852)", "c": [{"text": "[natural pace] [cautious] Just southwest of Amsterdam lay the Haarlemmermeer, a huge lake that grew as storms chewed away the peat around it. [0.3s] Year after year, it swallowed villages and farmland, and it crept dangerously close to Amsterdam and Leiden. [0.4s] Its storms were so violent that one corner of the lake became known for all the ships it had sunk.", "words": 57}, {"text": "[hope] In the 1640s, Leeghwater, the man behind the Beemster, wrote a plan to drain the Haarlemmermeer too. [0.3s] It needed well over a hundred windmills, and it was far too expensive. [0.5s] Nobody built it, and the lake kept growing for another two hundred years.", "words": 43}, {"text": "[determination] Then, in 1836, storms pushed the lake's water right up to Amsterdam and Leiden. [0.3s] This time, the government finally acted, and it used a brand new weapon, the steam engine. [0.4s] Three giant steam pumping stations were built, and one of them was named Leeghwater, after the man who had dreamed of this two centuries earlier.", "words": 55}, {"text": "[surprised] By 1852, the lake was dry. [0.3s] And on that old lakebed, about thirteen feet below sea level, sits one of Europe's busiest airports, Schiphol. [0.4s] Its name is usually said to mean ship hole, after all the ships the lake once swallowed.", "words": 41}]}, {"t": "Closing the sea (1916 to 1986)", "c": [{"text": "[natural pace] [interest] The biggest enemy was still out there, the Zuiderzee, the inland sea that had been torn open back in 1287. [0.3s] An engineer and politician named Cornelis Lely had a radical plan to close it off with one enormous dam. [0.4s] For years, most politicians thought it was too expensive and too crazy.", "words": 51}, {"text": "[serious] Then, in January 1916, a storm surge broke dikes around the Zuiderzee and flooded towns along its shores. [0.3s] Two years later, at the end of the First World War, the country faced serious food shortages. [0.5s] Suddenly, a giant dam that could protect the coast and create new farmland didn't sound so crazy anymore.", "words": 53}, {"text": "[awe] Work on the main dam, the Afsluitdijk, began in 1927, and in May 1932, the last gap was closed. [0.3s] It runs for about twenty miles across open water, and it turned the salty sea behind it into a freshwater lake. [0.4s] A sea that had drowned tens of thousands of people over the centuries was shut out in about five years.", "words": 60}, {"text": "[thoughtful] And then, the twist. [0.3s] Cornelis Lely never saw it finished, because he died in 1929, three years before the last gap was closed. [0.4s] Today, a statue of him stands on the dam, looking out over the water he tamed.", "words": 39}, {"text": "[enthusiasm] Behind the dam, the Dutch began draining huge chunks of the old sea floor. [0.3s] One of them, the Flevopolder, is often called the world's largest artificial island, and in 1986 it became part of the newest province, Flevoland. [0.4s] Its biggest city, Almere, didn't exist until the 1970s, and today more than two hundred thousand people live there, on the bottom of a sea.", "words": 63}]}, {"t": "The night of 1953", "c": [{"text": "[natural pace] [cautious] But the southwest of the country was still exposed. [0.3s] On the night of January thirty-first, 1953, a violent storm met a spring tide, and the North Sea rose higher than anyone alive had ever seen. [0.4s] It was a Saturday night, most people were asleep, and many warnings never reached them.", "words": 50}, {"text": "[serious] Dikes gave way across the islands of Zeeland and South Holland, and the water rushed into homes in the dark. [0.3s] One thousand eight hundred and thirty-six people died in the Netherlands, and about seventy thousand more had to be evacuated. [0.4s] The Dutch simply call it the flood disaster.", "words": 48}, {"text": "[thoughtful] Just weeks later, the government set up a Delta Committee with one job, to make sure this could never happen again. [0.3s] Its answer became one of the most ambitious flood defence projects ever attempted. [0.5s] The Dutch would shorten their coastline by sealing off almost every sea arm in the southwest.", "words": 50}]}, {"t": "The Delta Works (1953 to 1997)", "c": [{"text": "[natural pace] [determination] For more than forty years, the Dutch built dams, sluices and storm barriers across the delta. [0.3s] Some dikes were designed to hold back a storm so extreme it should come only once in ten thousand years. [0.4s] The whole system became known as the Delta Works.", "words": 45}, {"text": "[surprised] But halfway through, there was a fight. [0.3s] Fishermen and environmentalists protested that closing the Oosterschelde estuary completely would destroy its oysters, mussels and wildlife. [0.4s] So instead of a solid dam, engineers built a barrier about five and a half miles long, with giant gates that stay open and only close when a dangerous storm comes.", "words": 55}, {"text": "[awe] That barrier was finished in 1986. [0.3s] The last big piece came in 1997, the Maeslantkering near Rotterdam, two giant floating arms, each roughly as long as the Eiffel Tower is tall, that swing shut across the shipping channel. [0.4s] Normally they sit open, so ships can sail in and out of the biggest port in Europe.", "words": 55}, {"text": "[admiration] The American Society of Civil Engineers later named the Dutch sea defences one of the seven wonders of the modern world. [0.3s] Engineers and planners from New Orleans to Jakarta have come to study them. [0.4s] The country that kept losing to the sea had become the world's teacher on water.", "words": 49}]}, {"t": "Room for the river (1995 to today)", "c": [{"text": "[natural pace] [cautious] Then, in 1995, the threat came from the other direction. [0.3s] Heavy rain swelled the Rhine and the Meuse, and the river dikes came dangerously close to failing. [0.4s] About two hundred and fifty thousand people were evacuated, one of the largest evacuations in the country since the Second World War.", "words": 49}, {"text": "[thoughtful] No dikes broke, but the Dutch learned a lesson that sounds almost backwards. [0.3s] Instead of always building walls higher, they started giving the water space, moving dikes back, digging side channels, and letting some fields flood on purpose. [0.4s] The program was called Room for the River.", "words": 46}, {"text": "[interest] And the results are hard to believe. [0.3s] This small, crowded country of about eighteen million people is the second biggest exporter of farm products in the world by value, after only the United States. [0.4s] Much of it comes from land that, by nature, should be underwater.", "words": 46}, {"text": "[cautious] But the ground is still sinking, and the seas are rising. [0.3s] Remember that polder near Rotterdam, about twenty-two feet below sea level. [0.5s] In 2026, a plan moved ahead to build around eight thousand new homes right there, at the lowest point in the country.", "words": 44}, {"text": "[serious] Some people see that as Dutch confidence, and others call it a gamble. [0.3s] Experts are already debating how to prepare for the next century, with stronger dikes, floating homes, or even letting some low areas go back to the water. [0.4s] For now, the Dutch keep doing what they've always done, watching the water, and arguing about it together.", "words": 58}]}, {"t": "Ending", "c": [{"text": "[thoughtful] So that's the Netherlands. [0.3s] A country that started on piles of dirt, drowned its own fields to beat its enemies, pumped out lakes with windmills, and built a city on the bottom of a sea. [0.4s] Pliny asked whether this place belonged to the land or to the sea, and the Dutch answered, it belongs to us.", "words": 56}, {"text": "[natural pace] [curiosity] Today, millions of people live below sea level, protected by walls their ancestors started building a thousand years ago. [0.4s] So what do you think will happen to the Netherlands in the next fifty years? [0.3s] Tell me in the comments, and subscribe for the next long story.", "words": 46}]}], "words": 2294};
const KEY="vo-done-the-netherlands-shouldn-t-exist";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
