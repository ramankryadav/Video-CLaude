<style>
/* Layout: a sticky progress bar over one column of numbered cards, one Vids chunk per card */
:root{
  --paper:#f6f4ee; --sheet:#fffefa; --ink:#1e2230; --muted:#6a6c76; --rule:#d9d5c9;
  --pen:#2340a8; --brick:#a3412b; --tagbg:#e6e9f7; --pausebg:#f1e6df; --done:#2f7a4f; --donebg:#eaf3ec;
  --display:"Zilla Slab",Rockwell,Georgia,serif; --body:"Source Serif 4",Georgia,serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16181f; --sheet:#1e2129; --ink:#e7e5de; --muted:#9a9ca8; --rule:#343846;
  --pen:#9db0ff; --brick:#e0866f; --tagbg:#28305a; --pausebg:#4a2f27; --done:#7fd3a0; --donebg:#1d3226; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:17px/1.6 var(--body);padding-inline:16px;padding-block:24px 80px;margin:0}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
h1{font:700 clamp(24px,4.4vw,34px)/1.15 var(--display);margin:0;text-wrap:balance}
h2{font:700 20px/1.2 var(--display);margin:18px 0 0;text-wrap:balance;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
h2 small{font:400 12px var(--mono);color:var(--muted)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--brick)}
.lede{margin:0;color:var(--muted);max-width:64ch;font-size:15.5px}
.rules{display:flex;flex-wrap:wrap;gap:6px 14px;font:400 12.5px/1.5 var(--mono);color:var(--muted)}
.rules b{color:var(--ink);font-weight:500}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:10px;border-bottom:1px solid var(--rule);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog{flex:1 1 200px;min-width:0;display:flex;flex-direction:column;gap:5px}
.prog .lbl{font:500 12.5px var(--mono);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--done);width:0;transition:width .25s}
button{font:500 12.5px/1 var(--mono);border:1px solid var(--ink);background:transparent;color:var(--ink);padding:9px 12px;border-radius:3px;cursor:pointer}
button:hover{color:var(--pen);border-color:var(--pen)}
button:focus-visible,input:focus-visible{outline:2px solid var(--pen);outline-offset:2px}
label.tg{font:400 12.5px var(--mono);color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.card{background:var(--sheet);border:1px solid var(--rule);display:grid;grid-template-columns:auto 1fr;gap:0}
.card .num{font:500 13px var(--mono);color:var(--brick);padding:14px 12px;border-right:2px dashed var(--rule);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:6px;align-items:center}
.card .body{padding:12px 16px 12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.txt{margin:0;max-width:66ch}
.tag{font:500 12.5px var(--mono);background:var(--tagbg);color:var(--pen);padding:1px 5px;border-radius:2px;white-space:nowrap}
.tag.p{background:var(--pausebg);color:var(--brick)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;font:400 12px var(--mono);color:var(--muted)}
.row .acts{display:flex;gap:12px;align-items:center}
.card.done{background:var(--donebg);border-color:var(--done)}
.card.done .txt{opacity:.6}
.card.done .num{color:var(--done)}
body.hidedone .card.done{display:none}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:500 13px var(--mono);padding:9px 14px;border-radius:3px}
textarea.fb{width:100%;height:110px;font:13px var(--mono);background:var(--sheet);color:var(--ink);border:1px solid var(--rule)}
@media (max-width:480px){.card{grid-template-columns:1fr}.card .num{flex-direction:row;border-right:0;border-bottom:2px dashed var(--rule);padding:8px 14px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:12px">
    <span class="eyebrow">Google Vids voiceover · Zeno</span>
    <h1>The ENTIRE History of the Colosseum</h1>
    <p class="lede" id="lede"></p>
    <div class="rules"><span><b>Pace</b> natural only</span><span><b>Pauses</b> 0.3 s to 0.5 s, written as a number</span><span><b>No</b> whisper, slow, rushed, short, medium or long pause tags</span><span><b>Box</b> 3 sentences each</span></div>
  </header>
  <div class="sticky">
    <div class="prog"><span class="lbl" id="plbl"></span><div class="track"><div class="fill" id="pfill"></div></div></div>
    <button type="button" id="next">Jump to next</button>
    <label class="tg" for="hide"><input type="checkbox" id="hide"> Hide done</label>
    <button type="button" id="reset">Reset</button>
  </div>
  <main id="list" style="display:flex;flex-direction:column;gap:12px"></main>
</div>

<script>
const D = {"secs": [{"t": "Cold open · The arena that refused to die", "c": [{"text": "[natural pace] [bold] This is the Colosseum. [0.3s] You probably think it's just a giant stadium where gladiators fought to the death in front of cheering crowds. [0.4s] But for almost two thousand years, this building has been a stadium, a fortress, a village, a quarry, a garden and a church.", "words": 46}, {"text": "[sarcasm] It was built on the private lake of the most hated emperor in Roman history. [0.3s] It was paid for, many historians believe, with treasure taken from a temple in Jerusalem. [0.4s] And it isn't even named after itself, it's named after a giant statue that disappeared long ago.", "words": 47}, {"text": "[serious] Earthquakes knocked down a whole side of it, and Romans carried off its stones to build palaces and churches. [0.3s] At one point, more than four hundred kinds of plants were growing on its ruins. [0.5s] And yet today, it's the most famous ancient building on Earth, visited by millions of people every single year.", "words": 53}, {"text": "[interest] It wasn't the emperors that kept the Colosseum alive, and it wasn't the gladiators. [0.3s] It was the simple fact that it was too big to destroy, and too useful to forget. [0.4s] Now, let's take a closer look at the story of the arena that refused to die.", "words": 47}]}, {"t": "The emperor's lake (64 AD)", "c": [{"text": "[natural pace] [cautious] In 64 AD, a great fire swept through Rome and burned for days, destroying a huge part of the city. [0.3s] Many Romans whispered that their emperor, Nero, was secretly happy about it. [0.4s] Because right after the fire, he grabbed a vast stretch of the burned city for himself.", "words": 48}, {"text": "[amused] On that land, Nero built the Golden House, a palace so huge it had gardens, vineyards and its own artificial lake. [0.3s] At the entrance stood a colossal bronze statue of Nero himself, reportedly more than thirty metres tall. [0.4s] When the palace was finished, Nero supposedly said that at last he could live like a human being.", "words": 56}, {"text": "[serious] Four years later, Nero was overthrown, and he took his own life. [0.3s] Rome fell into a civil war, and in a single year, four different men claimed the throne. [0.4s] The last one standing was a tough old general named Vespasian.", "words": 40}, {"text": "[determination] Vespasian had a clever idea. [0.3s] He drained Nero's private lake, and on that exact spot, he decided to build something for the people of Rome. [0.5s] The most selfish piece of land in the city would become the biggest public stage in the world.", "words": 43}]}, {"t": "Building the giant (70 AD)", "c": [{"text": "[natural pace] [serious] Building it would cost a fortune, and Vespasian had one. [0.3s] In 70 AD, his son Titus had captured Jerusalem and destroyed its great temple, and the treasure was carried back to Rome. [0.4s] Holes left by long-lost metal letters on an old stone suggest the original inscription said the amphitheatre was built from the spoils of war.", "words": 56}, {"text": "[authoritative] Work began around 70 AD, and it moved fast. [0.3s] Builders used an estimated hundred thousand cubic metres of travertine stone, held together with hundreds of tonnes of iron clamps. [0.4s] Remember those iron clamps, because they come back later in this story.", "words": 41}, {"text": "[cautious] Who did the heavy lifting? [0.3s] Many historians believe thousands of Jewish prisoners of war, brought back from Jerusalem, were forced to work alongside skilled Roman builders and engineers. [0.4s] The greatest symbol of Rome's power was built partly by the people it had just conquered.", "words": 44}, {"text": "[awe] The finished building was almost fifty metres high, as tall as a modern fifteen-storey block. [0.3s] It had eighty entrances, and each ticket showed a gate number, so around fifty thousand people could get in and out in minutes. [0.5s] Think about that for a second, Roman crowd control was so good that modern stadiums still copy it.", "words": 56}, {"text": "[surprised] And then, the twist. [0.3s] In 79 AD, with the building almost finished, Vespasian died, never seeing his great arena open. [0.4s] That same year, Mount Vesuvius erupted and buried Pompeii, so the new emperor, Titus, faced disaster after disaster.", "words": 38}, {"text": "[interest] Officially, it was called the Flavian Amphitheatre, after Vespasian's family. [0.3s] But Nero's giant statue still stood right next to it, and over the centuries, people started calling the building after that colossus. [0.4s] That's how the arena got the name we use today, the Colosseum.", "words": 44}]}, {"t": "A hundred days of games (80 AD)", "c": [{"text": "[natural pace] [excited] In 80 AD, Titus opened the Colosseum with games that reportedly lasted a hundred days. [0.3s] According to the historian Cassius Dio, around nine thousand animals were killed during the celebrations. [0.4s] Ancient writers even claimed that the arena was flooded with water for a mock naval battle, though historians still argue about how that could have worked.", "words": 56}, {"text": "[interest] Entry to the games was usually free, paid for by the emperor to keep the people happy. [0.3s] But where you sat depended on who you were, with senators at the front, ordinary citizens higher up, and the poorest people and most women at the very top. [0.4s] The Colosseum wasn't just entertainment, it was the whole of Roman society, sorted row by row.", "words": 62}, {"text": "[admiration] On hot days, a giant awning was stretched over the crowd to give them shade. [0.3s] It was reportedly operated by sailors from the Roman fleet at Misenum, the same fleet whose admiral had died trying to rescue people from Vesuvius. [0.4s] Only sailors had the skill to handle that much rope and canvas.", "words": 52}]}, {"t": "The machine underneath (81 AD)", "c": [{"text": "[natural pace] [curiosity] The next emperor, Domitian, added the Colosseum's greatest secret. [0.3s] Under the arena floor, he built the hypogeum, a two-level maze of tunnels, cages and rooms. [0.4s] This is where animals, gladiators and stage sets waited in the dark.", "words": 37}, {"text": "[awe] Dozens of wooden lifts, pulled by ropes and turned by teams of workers, could raise animals straight up into the arena. [0.3s] A lion or a bear could suddenly appear through a trapdoor in the middle of the sand. [0.5s] To the crowd above, it must have looked like magic.", "words": 48}, {"text": "[thoughtful] But that machine had a cost. [0.3s] Once the tunnels were built under the floor, the arena could never be flooded again. [0.4s] If the naval battles ever really happened, they ended with Domitian.", "words": 32}]}, {"t": "Myths of the arena", "c": [{"text": "[natural pace] [interest] Now, a lot of what you think you know about the Colosseum may be wrong. [0.3s] A typical day had a schedule, with animal hunts in the morning, public executions of criminals around midday, and gladiator fights in the afternoon. [0.4s] The gladiators were the main event, the superstars of Rome.", "words": 49}, {"text": "[surprised] But most gladiator fights didn't end in death. [0.3s] Gladiators were expensive to buy, train and feed, so many historians believe most of them survived most of their fights. [0.4s] And the famous thumbs down sign, nobody actually knows for sure which gesture meant death.", "words": 43}, {"text": "[sarcasm] The famous line, those who are about to die salute you, was reportedly said only once, and not even in the Colosseum. [0.3s] It was shouted at a naval battle on a lake for Emperor Claudius, years before the Colosseum was built. [0.4s] Hollywood just loved it too much to let it go.", "words": 51}, {"text": "[thoughtful] Even the story of Christians being thrown to the lions here is surprisingly hard to prove. [0.3s] Christians were certainly persecuted in Rome, but historians have found little solid evidence that they were executed in this particular arena. [0.4s] Much of that story was attached to the Colosseum centuries later.", "words": 48}]}, {"t": "The emperor gladiator (192 AD)", "c": [{"text": "[natural pace] [amused] Some emperors didn't just watch the games, they joined them. [0.3s] Emperor Commodus loved the arena so much that he fought as a gladiator and hunted animals in front of the crowd. [0.4s] He reportedly charged the treasury a million sesterces every time he appeared.", "words": 43}, {"text": "[sarcasm] The historian Cassius Dio was sitting in the crowd one day when Commodus cut off an ostrich's head and waved it at the senators. [0.3s] Dio later admitted that he chewed leaves from his laurel wreath to stop himself from laughing out loud. [0.4s] A few months later, Commodus was assassinated, strangled in his bath by a wrestler.", "words": 56}]}, {"t": "The end of the games (404 AD)", "c": [{"text": "[natural pace] [serious] As Rome became Christian, the games began to look less like glory and more like cruelty. [0.3s] According to a famous story, in 404 AD a monk named Telemachus jumped into an arena to stop a fight, and the angry crowd killed him. [0.4s] Emperor Honorius was said to be so shocked that he banned gladiator fights.", "words": 55}, {"text": "[frustrated] Nature was also attacking the arena. [0.3s] Earthquakes in the fifth century damaged the building, and officials paid for repairs again and again. [0.4s] In fact, the best-known ancient inscription you can still see there today records one of those repairs.", "words": 39}, {"text": "[cautious] Animal hunts continued for another century, with the last recorded hunts around 523 AD. [0.3s] But by then, the Western Roman Empire was gone, and Rome had shrunk from about a million people to a small fraction of that. [0.5s] The greatest arena in the world now stood almost empty.", "words": 48}]}, {"t": "Fortress, quarry and village (Middle Ages)", "c": [{"text": "[natural pace] [curiosity] So what do you do with a stadium nobody needs? [0.3s] In the Middle Ages, Romans moved in, with houses, workshops and stables built right into its arches. [0.4s] The Colosseum became a small neighbourhood of its own.", "words": 36}, {"text": "[interest] Pilgrims who came to Rome were amazed by it. [0.3s] A famous medieval saying, often credited to the English monk Bede, declared that as long as the Colosseum stands, Rome will stand, and when Rome falls, the world will fall. [0.4s] Remember that prophecy, because the Colosseum came very close to falling.", "words": 50}, {"text": "[serious] In the twelfth century, a powerful noble family, the Frangipane, turned it into a fortress. [0.3s] Rome's rich families were constantly fighting each other, and a giant stone ring was the perfect castle. [0.4s] The arena built for entertainment had become a war base.", "words": 42}, {"text": "[frustrated] Then, in 1349, a massive earthquake struck Rome, and the outer wall on the south side came crashing down. [0.3s] That's why today, one side of the Colosseum is tall and complete, while the other looks like a bite was taken out of it. [0.4s] The fallen stone was a gift to the builders of Rome.", "words": 54}, {"text": "[sarcasm] For centuries, the Colosseum was treated like a free quarry. [0.3s] Its stone was carted away to build churches, palaces and bridges across Rome, and according to many accounts, even St Peter's Basilica. [0.4s] People even chiselled into the walls to steal the iron clamps, and that's why the Colosseum is covered in thousands of strange holes today.", "words": 56}, {"text": "[amused] Some popes had even stranger ideas. [0.3s] In 1590, Pope Sixtus the Fifth planned to turn the Colosseum into a wool factory, with workshops on the ground floor and homes for the workers above. [0.4s] Luckily for history, he died before the work could begin.", "words": 43}]}, {"t": "Saved by a pope (1749)", "c": [{"text": "[natural pace] [hope] The destruction finally slowed thanks to a pope. [0.3s] In 1749, Pope Benedict the Fourteenth declared the Colosseum a sacred place in memory of Christian martyrs, and set up the stations of the cross inside. [0.4s] Suddenly, stealing its stone was no longer just theft, it was sacrilege.", "words": 46}, {"text": "[awe] And left alone, the Colosseum turned green. [0.3s] In 1855, an English botanist named Richard Deakin counted four hundred and twenty different plant species growing on its ruins. [0.5s] Some were so rare that people believed their seeds had arrived in the fur of exotic animals brought for the games, though nobody can prove it.", "words": 53}, {"text": "[determination] In the nineteenth century, engineers finally fought back against gravity. [0.3s] They built huge brick buttresses to stop the damaged walls from collapsing, and you can still see them on both ends today. [0.4s] Most of the plants were cleared away, and the Colosseum became a monument instead of a ruin.", "words": 49}]}, {"t": "The modern Colosseum (1932 to today)", "c": [{"text": "[natural pace] [cautious] In 1932, the dictator Benito Mussolini built a grand new avenue straight to the Colosseum, to link his regime to the glory of ancient Rome. [0.3s] It looked impressive, but it bulldozed old neighbourhoods and ancient remains along the way. [0.4s] For decades afterwards, traffic roared around the Colosseum, and pollution turned its stones black.", "words": 53}, {"text": "[hope] Then came a rescue. [0.3s] In 2007, the Colosseum was voted one of the New Seven Wonders of the World, and soon after, an Italian luxury company paid for a cleaning and restoration worth about twenty-five million euros. [0.4s] For the first time in centuries, the stone shone close to its original colour.", "words": 51}, {"text": "[admiration] And today, the arena of death has taken on a very different meaning. [0.3s] Every Good Friday, the pope leads a procession here in memory of the Christian martyrs. [0.4s] And whenever a campaign against the death penalty wins a victory somewhere in the world, the Colosseum is lit up in gold.", "words": 50}]}, {"t": "The Colosseum today", "c": [{"text": "[natural pace] [interest] Today, it's one of the most visited places on Earth, with park figures pointing to around nine million visitors in a single year. [0.3s] There are even plans to rebuild part of the arena floor, so visitors can stand where the gladiators once stood. [0.4s] Nearly two thousand years after it opened, the crowds have never really stopped coming.", "words": 57}, {"text": "[thoughtful] Remember Nero's giant statue, the one that gave the Colosseum its name? [0.3s] That statue disappeared long ago, and nobody knows exactly what happened to it. [0.5s] The emperor who wanted to be remembered forever is gone, but the arena built on his lake still carries his statue's name.", "words": 47}, {"text": "[positive] And remember that old prophecy, that when the Colosseum falls, Rome and the world will fall with it? [0.3s] Earthquakes, looters, factory plans and dictators all came close, but the Colosseum is still standing. [0.4s] So by that old saying, the world is safe, at least for now.", "words": 46}]}, {"t": "The story of the Colosseum", "c": [{"text": "[natural pace] [thoughtful] So that's the story of the Colosseum. [0.3s] Not just a gladiator stadium, but a tyrant's lake turned into a gift for the people, paid for with the spoils of war, and then a fortress, a village, a quarry and a garden. [0.4s] It survived earthquakes, looters and dictators, because it was always too big to destroy, and too useful to forget.", "words": 60}, {"text": "[curiosity] Every age has looked at the Colosseum and seen something different, glory, cruelty, faith or history. [0.3s] Maybe that's why it still stands, because every generation finds a new reason to keep it. [0.5s] So what do you think the Colosseum will be in another two thousand years?", "words": 46}, {"text": "[positive] Tell me in the comments, and if you missed it, go watch our full story of Pompeii, the city that was buried the year before the Colosseum opened. [0.3s] If you love long, true stories from history, this channel is for you. [0.4s] Subscribe for the next long story.", "words": 47}]}], "words": 2264};
const KEY="vo-done-the-entire-history-of-the-colosseum";
let done={}; try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const fmt=t=>esc(t).replace(/\[([^\]]+)\]/g,(m,x)=>`<span class="tag${/^\d/.test(x)?" p":""}">[${x}]</span>`);
const all=[]; let n=0, html="";
D.secs.forEach(s=>{
  const w=s.c.reduce((a,c)=>a+c.words,0);
  html+=`<h2>${esc(s.t)} <small>${s.c.length} boxes · ${w} words</small></h2>`;
  s.c.forEach(c=>{ n++; const id=String(n).padStart(3,"0"); all.push({id,text:c.text});
    html+=`<article class="card${done[id]?" done":""}" id="c${id}">
      <div class="num"><span>${id}</span></div>
      <div class="body"><p class="txt">${fmt(c.text)}</p>
      <div class="row"><span>vo_${id}_zeno · ${c.words} words</span><span class="acts">
      <label class="tg" for="d${id}"><input type="checkbox" id="d${id}" data-id="${id}"${done[id]?" checked":""}> Done</label>
      <button type="button" data-copy="${id}">Copy</button></span></div></div></article>`;});
});
document.getElementById("list").innerHTML=html;
const mins=Math.round(D.words/150);
document.getElementById("lede").textContent=`${all.length} boxes · ${D.words.toLocaleString()} spoken words · about ${mins}–${Math.round(D.words/140)} minutes at a natural pace. Copy a box, paste it into a Vids scene, generate, then move on. Copying marks the box done, and your progress is saved in this browser.`;
function upd(){const k=all.filter(a=>done[a.id]).length;document.getElementById("plbl").textContent=`${k} / ${all.length} done`;document.getElementById("pfill").style.width=(k/all.length*100)+"%";}
function setDone(id,v){done[id]=v;if(!v)delete done[id];save();document.getElementById("c"+id).classList.toggle("done",v);document.getElementById("d"+id).checked=v;upd();}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1500);}
document.getElementById("list").addEventListener("click",e=>{
  const b=e.target.closest("button[data-copy]"); if(!b)return; const id=b.dataset.copy; const text=all.find(a=>a.id===id).text;
  setDone(id,true);
  navigator.clipboard.writeText(text).then(()=>toast(`Box ${id} copied`)).catch(()=>{
    const old=b.closest(".body").querySelector("textarea.fb"); if(old)old.remove();
    const ta=document.createElement("textarea");ta.className="fb";ta.value=text;b.closest(".row").insertAdjacentElement("afterend",ta);ta.select();toast("Press Ctrl+C to copy");});
});
document.getElementById("list").addEventListener("change",e=>{const c=e.target.closest("input[data-id]");if(c)setDone(c.dataset.id,c.checked);});
document.getElementById("next").addEventListener("click",()=>{const a=all.find(a=>!done[a.id]);if(a)document.getElementById("c"+a.id).scrollIntoView({behavior:"smooth",block:"center"});else toast("All boxes done");});
const hide=document.getElementById("hide");
hide.addEventListener("change",()=>document.body.classList.toggle("hidedone",hide.checked));
const rs=document.getElementById("reset");
rs.addEventListener("click",()=>{if(rs.dataset.armed){all.forEach(a=>{if(done[a.id])setDone(a.id,false)});rs.textContent="Reset";delete rs.dataset.armed;}else{rs.dataset.armed=1;rs.textContent="Click again to clear";setTimeout(()=>{rs.textContent="Reset";delete rs.dataset.armed},3000);}});
upd();
</script>
